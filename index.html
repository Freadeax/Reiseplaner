<!-- Entwicklungsstand 1.4 · 13.10.2026
Grundlage: bereitgestellte Reiseplaner(1).html. Bestehender Speicherschlüssel rp-trips bleibt erhalten.
Neu: explizite Gästekartenbestätigung, gemeinsames Top-Leistungs-Tageslimit,
volle Reisedauer, datumsgebundenes Silvester, manuelle Strecke, offene Kosten,
Zurücksetzen unterkunftsgebundener Angaben, Speicherfehleranzeige, Eingabeprüfungen.
Manueller JSON-Export für einzelne/alle Reisen und Import mit Prüfung/Vorschau;
bei ID-Konflikt nur überspringen oder zusätzliche Kopie, nie überschreiben.
Logik- und Startansicht-Prüfungen in Node erfolgreich. Kein Browser-/iPhone-Test: Browserbinary nicht verfügbar.
Dateivorschau der ChatGPT-iPhone-App zeigt die Kopfzeile, führt die interaktive Oberfläche offenbar nicht zuverlässig aus.
Statische Lade-/Fehlermeldung hinzugefügt. Privates Hosting vorbereitet, Veröffentlichung wegen Netzwerkproxy-Fehler offen.
Keine Anbieterrecherche durchgeführt. Katalogangaben bleiben unbestätigt.
Offen: konkrete Angebote mit Gebühren/Preisbasen; Import bestehender Altdateien ohne Sicherungsformat;
Zahlungen und Kaution; genaue Termine und Reisezeiten; vollständige Quellennachweise;
Saisonprüfung der Vorlagen; Tarife bei >5 Verleihtagen; gemeinsame Nutzung mit Zugriffsschutz.
Lokaler Browser-Speicher ist keine Gerätesynchronisation. Bestehende Claude-DB-Anbindung unverändert.
v1.4: beschädigter lokaler Speicher wird nicht überschrieben; Rohdaten-Download und bewusstes Zurücksetzen.
v1.5: Unterwegs-Ansicht (heute/morgen), laufende Reise nicht mehr als „vorbei“, Reisemappe mit Druck/PDF,
Kalenderexport (.ics, grobe Zeitfenster, vorläufig) und Text zum Teilen. Kein neues Speicherfeld.
v1.6: Plan B bei schlechtem Wetter (Indoor-Ideen passend zu Datum/Katalogregeln), Offline-Start per Service Worker
(nur über http/https, Netz zuerst), App-Icon und Manifest für den Homescreen. Browser-Klicktest im Repo.
v1.7: Packliste aus dem Plan (Mitbringsel der geplanten Unternehmungen). Spartipps: keine Unterkunft ohne Sauna
empfehlen, wenn Sauna in der Unterkunft geplant ist; kein „frei mit PLUS“ ohne bestätigte Gästekarte.
v1.8: Verleih über 5 Tage nicht mehr gedeckelt (hochgerechnet), Skipass/Kurs ab Tag 4 als Schätzung markiert
und als offene Kosten benannt.
v1.9: Tagesausflug mit festem Datum (Anreise = Abreise, 0 Nächte); Reiseart „Tagesausflug“ setzt 0 Nächte;
ohne Übernachtung keine Unterkunftspflicht in Plan-Check, offenen Kosten und Checkliste.
Nächster Schritt: echter Browser-/iPhone-Klicktest, dann Angebots-/Kostenmodell und bezahlte/offene Beträge.
-->

<style>
/* Layout: App mit Kopfleiste. Reise-Bereiche als Wegweiser-Reiter. Raster für Unterkünfte, Unternehmungen und Tagesplan. Details öffnen als Blatt von unten. */
:root{
  --bg:#F7F4EE; --surface:#FFFEFB; --surface-2:#EDEBE2; --surface-3:#DDDCD0;
  --ink:#283B33; --muted:#606A60; --line:#D8DACE;
  --spruce:#345D4C; --spruce-soft:#E4EDE3;
  --sign:#EBC6AD; --sign-ink:#442D21;
  --ok:#276749; --warn:#8C551D; --bad:#AD3931; --blue:#315E8C;
  --c1:#345D4C; --c2:#54827E; --c3:#9A732F; --c4:#827194; --c5:#4A7650; --c6:#AE6546; --c7:#78867B;
  --f-display:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17211D; --surface:#202D26; --surface-2:#2B3930; --surface-3:#39493D;
  --ink:#F0F1E9; --muted:#B4BFB1; --line:#455346;
  --spruce:#ACD2BA; --spruce-soft:#2C4033;
  --sign:#E6BCA0; --sign-ink:#34251C;
  --ok:#5CC487; --warn:#E3A847; --bad:#F0736A; --blue:#79A6F2;
  --c1:#8CC2CF; --c2:#5FA3B5; --c3:#E0B93A; --c4:#A79BE0; --c5:#5CC487; --c6:#E8925F; --c7:#7E8D99; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17211D; --surface:#202D26; --surface-2:#2B3930; --surface-3:#39493D;
  --ink:#F0F1E9; --muted:#B4BFB1; --line:#455346;
  --spruce:#ACD2BA; --spruce-soft:#2C4033;
  --sign:#E6BCA0; --sign-ink:#34251C;
  --ok:#5CC487; --warn:#E3A847; --bad:#F0736A; --blue:#79A6F2;
  --c1:#8CC2CF; --c2:#5FA3B5; --c3:#E0B93A; --c4:#A79BE0; --c5:#5CC487; --c6:#E8925F; --c7:#7E8D99; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.05;margin:0}
h1{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:700}
h2{font-size:1.7rem;font-weight:700}
h3{font-size:1.2rem;font-weight:600}
h4{font-size:1.02rem;font-weight:600;letter-spacing:.02em}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.small{font-size:.87rem}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.78rem}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{max-width:62ch}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
section.block{display:flex;flex-direction:column;gap:14px;padding-block:20px;border-top:1px solid var(--line)}
section.block:first-child{border-top:0;padding-top:4px}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Kopf */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:4px 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-size:1.5rem;font-weight:700;letter-spacing:.01em}
.sync{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;min-height:36px;cursor:pointer;text-align:left}
.sync:hover{border-color:var(--line)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.sync.on i{background:var(--ok)}

/* Buttons */
.btn{cursor:pointer;border:0;border-radius:8px;background:var(--spruce);color:var(--bg);padding:10px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--spruce);border:1px solid var(--spruce)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn.warn{background:var(--bad);color:#fff}
.btn.sign{background:var(--sign);color:var(--sign-ink)}
.btn[disabled]{opacity:.5;cursor:default}
.lnk{display:inline-flex;align-items:center;min-height:36px;padding:6px 11px;border:1px solid var(--line);border-radius:8px;color:var(--spruce);text-decoration:none;font-weight:600;font-size:.88rem;background:var(--surface)}
.lnk:hover{border-color:var(--spruce)}
.chipbtn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:600;font-size:.9rem;min-height:38px}
.chipbtn[aria-pressed="true"]{background:var(--spruce);border-color:var(--spruce);color:var(--bg)}
.opt{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:.96rem;line-height:1.25;min-height:44px}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.opt[aria-pressed="true"]{border-color:var(--spruce);background:var(--spruce-soft);box-shadow:inset 0 0 0 2px var(--spruce)}
.opts{display:flex;flex-wrap:wrap;gap:8px}

/* Reiter als Wegweiser */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:thin;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:6px}
.tab{flex:none;cursor:pointer;border:0;background:var(--surface-2);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.03em;text-transform:uppercase;padding:8px 24px 8px 12px;clip-path:polygon(0 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,0 100%)}
.tab[aria-current="page"]{background:var(--sign);color:var(--sign-ink)}
.tab .n{font-family:var(--f-mono);font-size:.68rem;margin-left:4px;opacity:.75}

/* Karten & Raster */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.sel{border-color:var(--spruce);box-shadow:inset 0 0 0 2px var(--spruce)}
.card.click{cursor:pointer;text-align:left}
.card.click:hover{border-color:var(--spruce)}
.card .foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.price{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.note{background:var(--spruce-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:.94rem}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--ok)}.badge.est{color:var(--warn)}.badge.plus{color:var(--blue)}.badge.bad{color:var(--bad)}
.badge.cat{background:transparent;border:1px solid currentColor}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.1}
.kpi small{color:var(--muted);font-size:.82rem}
.sbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.sbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}

/* Checks */
.checks-list{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:.93rem}
.chk b{flex:none;font-family:var(--f-mono);font-size:.7rem;padding:2px 6px;border-radius:4px;margin-top:2px}
.chk.warn b{background:var(--warn);color:var(--bg)}.chk.info b{background:var(--surface-3)}.chk.ok b{background:var(--ok);color:var(--bg)}

/* Tagesplan-Raster */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.dcol{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.dhead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dhead b{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.dslot{padding:8px 10px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;min-height:64px}
.dslot:last-child{border-bottom:0}
.dslot .lbl{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.item{cursor:pointer;text-align:left;border:1px solid var(--line);border-left:4px solid var(--c7);border-radius:6px;background:var(--bg);padding:6px 8px;font-size:.88rem;line-height:1.25;display:flex;flex-direction:column;gap:2px}
.item small{color:var(--muted);font-size:.76rem}
.item.fixed{cursor:default;border-left-color:var(--sign);background:var(--surface-2)}
.item.warn{outline:2px solid var(--warn);outline-offset:-1px}
.add{cursor:pointer;border:1px dashed var(--line);background:transparent;border-radius:6px;padding:4px;color:var(--muted);font-size:.8rem}
.add:hover{border-color:var(--spruce);color:var(--spruce)}

/* Tabelle */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-weight:500;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.r,th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td small{display:block;color:var(--muted);font-size:.78rem}
tr.grp td{background:var(--surface-2);font-weight:700}
tr.total td{font-family:var(--f-display);font-size:1.35rem;font-weight:700;border-bottom:0}

/* Formulare */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=url],select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;width:100%;font-size:1rem;min-height:44px}
textarea{min-height:160px;resize:vertical;line-height:1.5}
.copybox{font-family:var(--f-body);font-size:.9rem;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;user-select:text}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* Blatt */
.sheet-bg{position:fixed;inset:0;background:rgba(10,18,24,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .x{align-self:flex-end;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-family:var(--f-mono);font-size:.75rem}
@media (min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:16px;max-height:84vh}}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dock .sum{font-family:var(--f-display);font-weight:700;font-size:1.4rem;white-space:nowrap}
.dock .nm{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw}
.dock .bar{flex:1}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
.facts dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.facts dd{margin:0}
.mdays{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.mday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
@media print{
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--surface:#fff;--surface-2:#f1f1f1;--surface-3:#e4e4e4;--ink:#000;--muted:#444;--line:#bbb;--spruce:#1E4D59;--spruce-soft:#eef3f5;--ok:#2C7A4B;--warn:#7a5210;--bad:#B8352B;--blue:#000;color-scheme:light}
  body{background:#fff;color:#000;font-size:12pt}
  .top,.tabs,.dock,#sheet-root,#msg,.noprint,.lnk{display:none!important}
  .wrap{max-width:none;padding:0}
  section.block{padding-block:10px}
  .mday,.facts,tr{break-inside:avoid}
}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* Reisebuch: gemeinsame Designbasis, siehe docs/DESIGN_CATALOG.md. */
@media screen{
  h1{font-size:clamp(2rem,6vw,3rem);letter-spacing:-.035em;line-height:1.12}
  h2{font-size:1.55rem;line-height:1.2;letter-spacing:-.02em}
  h3,h4{line-height:1.3}
  .top{gap:12px;flex-wrap:wrap;padding-block:12px 20px}
  .brand b{letter-spacing:-.025em}
  .lead{line-height:1.7}
  section.block{gap:18px;padding-block:26px}
  #view>section.block:first-child,.finder-hero{background:var(--spruce-soft);border:1px solid var(--line);border-radius:24px;padding:24px;margin-block:8px 18px}
  .grid,.kpis{gap:16px}
  .card,.panel{padding:20px;border-radius:var(--r);box-shadow:0 4px 16px #182b2310}
  .card{gap:12px}
  .card.sel{box-shadow:inset 0 0 0 2px var(--spruce)}
  .btn,.lnk,.opt{border-radius:12px}
  .lnk,.btn.sm,.chipbtn{min-height:44px}
  .btn{justify-content:center}
  .tabs{gap:8px;padding-block:10px;background:var(--bg)}
  .tab{clip-path:none;border-radius:12px;padding:12px 16px;min-height:44px;text-transform:none;letter-spacing:0;font-family:var(--f-body);border:1px solid transparent}
  .tab[aria-current="page"]{border-color:var(--sign-ink);font-weight:700}
  .badge{font-family:var(--f-body);font-size:.76rem;text-transform:none;letter-spacing:0;white-space:normal;padding:4px 9px}
  .fld>span,th{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:.85rem;font-weight:600}
  input[type=text],input[type=number],input[type=date],input[type=month],input[type=url],select,textarea{border-radius:12px}
  .chk{padding:14px;border-radius:12px;gap:12px}
  .chk input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--spruce)}
  .note{padding:16px;line-height:1.6}

/* ================= Reise-Logik ================= */
function nightsOf(t){if(t.dateMode==='fix'){const a=pd(t.start),b=pd(t.end);if(a&&b&&b>=a)return Math.round((b-a)/864e5)}return Math.max(0,Math.round(num(t.nights,3)))}
function daysOf(t){
  const n=nightsOf(t)+1, out=[], a=pd(t.start);
  for(let i=0;i<n;i++){
    if(t.dateMode==='fix'&&a){const d=new Date(a.getTime()+i*864e5);out.push({i,date:d,label:fmtD(d),md:iso(d).slice(5)})}
    else out.push({i,date:null,label:'Tag '+(i+1),md:''});
  }
  return out;
}
function rangeText(t){
  if(t.dateMode==='fix'){const a=pd(t.start),b=pd(t.end);if(a&&b)return fmtLong(a)+' – '+fmtLong(b)+' · '+nightsOf(t)+' Nächte'}
  if(t.dateMode==='flex'){const m=t.month?MONTHS[+t.month.slice(5,7)-1]+' '+t.month.slice(0,4):'Zeitraum offen';return m+' · '+nightsOf(t)+' Nächte (flexibel)'}

function checklist(t){

const Sync={state:'idle',error:'',timer:null,running:false,again:false,last:0,notice:'',

};

function go(h,keepScroll){
  h=(h||'').replace(/^#/,'');
  if(h==='neu'){UI.view='neu';UI.draft=UI.draft||newTrip()}
  else if(h==='konto'){UI.view='konto'}
  else if(h==='entdecken'){UI.view='entdecken'}
  else if(/^r-[a-z0-9]+-[a-z]+$/.test(h)){const [,id,tab]=h.split('-');if(Store.get(id)&&TABS.some(x=>x[0]===tab)){UI.view='reise';UI.tid=id;UI.tab=tab;UI.pending=null}else{UI.view='reisen';UI.pending=h}}
  else {UI.view='reisen';if(/^r-/.test(h))UI.pending=h}
  const target=UI.view==='reise'?'r-'+UI.tid+'-'+UI.tab:UI.view;
  try{history.replaceState(null,'','#'+target)}catch(e){}
  closeSheet();render();if(!keepScroll)try{window.scrollTo(0,0)}catch(e){}
}

function stayCommitted(t){const o=activeOffer(t);return !!(t.check&&t.check.stay||o&&(o.booked||num(o.paid,0)>0));}
function commitmentIssues(before,after){
 const out=[], old=activeOffer(before), fresh=activeOffer(after);
 if(stayCommitted(before)&&(before.stayId!==after.stayId||before.activeOfferId!==after.activeOfferId||!after.check?.stay&&before.check?.stay||old&&fresh&&JSON.stringify(old)!==JSON.stringify(fresh)))out.push('Unterkunft ist gebucht oder bereits bezahlt');
 const signature=(t,k)=>sortedItems(t).filter(it=>{const a=actOf(t,it.act);return a&&(k==='kurs'?a.kurs:k==='verleih'?a.gear:k==='skipass'?a.pass||a.kurs:k==='act:'+it.act);}).map(it=>[it.uid,it.act,it.day,it.slot]).sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
 Object.entries(before.check||{}).forEach(([k,done])=>{if(done&&k.startsWith('b-')&&JSON.stringify(signature(before,'act:'+k.slice(2)))!==JSON.stringify(signature(after,'act:'+k.slice(2))))out.push('Gebuchte Unternehmung würde verändert');});
 Object.entries(before.ledger||{}).forEach(([k,e])=>{if(!(e.status==='gebucht'||e.status==='angefragt'||num(e.paid,0)>0||e.due))return;
  if(JSON.stringify(signature(before,k))!==JSON.stringify(signature(after,k)))out.push('Termin mit Buchung, Zahlung oder Fälligkeit würde verändert');
  if(JSON.stringify(e)!==JSON.stringify((after.ledger||{})[k]))out.push('Zahlungsangaben würden verändert');
 });
 return [...new Set(out)];
}

function setField(obj,f,v){
  if(['persons','nights','budget','km','routeKm','ticket','verb','preis','stayQuote'].includes(f)&&num(v,0)<0){alertMsg('Negative Werte sind nicht erlaubt.');return;}
  if(['persons','nights'].includes(f)){obj[f]=Math.max(f==='persons'?1:0,Math.round(num(v,0)));return;}
  if(['persons','nights','budget','km','routeKm','ticket'].includes(f)){obj[f]=Math.max(0,num(v,0));if(f==='km')delete obj.kmSrc;}
  else if(['verb','preis'].includes(f)) obj[f]=num(v,f==='verb'?7.5:2.15);
  else if(f==='stayQuote') obj[f]=num(v,0)>0?num(v,0):null;
  else obj[f]=v;
}

document.addEventListener('change',e=>{
  const el=e.target, t=cur();
  if(Store.corruptRaw!==null)return;
  if(el.id==='import-file'){
    const file=el.files&&el.files[0];el.value='';if(!file)return;
    readBackupFile(file);return;
  }
  if(el.matches('[data-act="check"]')&&t){t.check=t.check||{};if(el.checked)t.check[el.getAttribute('data-val')]=true;else delete t.check[el.getAttribute('data-val')];save(t);render();return}
  if(el.matches('[data-act="card-confirm"]')&&t){t.cardConfirmed=el.checked;save(t);render();return}
  if(el.matches('[data-act="mappe-notes"]')){UI.mappeNotes=el.checked;render();return}
  if(el.matches('[data-act="online"]')&&t){t.online=el.checked;save(t);render();return}
  const f=el.getAttribute('data-f'); if(!f) return;
  if(el.closest('#draft')){setField(UI.draft,f,el.value);if(['start','end','nights'].includes(f))render();return}
  if(el.closest('#editform')){setField(UI.edit,f,el.value);return}
  if(t){setField(t,f,el.value);save(t);if(f!=='notes')render()}
});

function alertMsg(m){let n=$('#msg');if(!n){n=document.createElement('div');n.id='msg';n.setAttribute('role','alert');n.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:90vw';document.body.appendChild(n)}n.textContent=m;n.hidden=false;clearTimeout(n._t);n._t=setTimeout(()=>{n.hidden=true},2600)}

/* Suchzentrale v2: reine Anbieteradapter, nachvollziehbare Angebote, Profile. */
const PROVIDERS=[
 {id:'booking',name:'Booking.com',home:'https://www.booking.com/',mode:'search'},
 {id:'check24',name:'CHECK24',home:'https://hotel.check24.de/',mode:'portal'},
 {id:'fewo',name:'FeWo-direkt',home:'https://www.fewo-direkt.de/',mode:'search'},
 {id:'airbnb',name:'Airbnb',home:'https://www.airbnb.de/',mode:'search'},
 {id:'holidu',name:'Holidu',home:'https://www.holidu.de/',mode:'portal'},
 {id:'direkt',name:'Direkt beim Gastgeber',home:'',mode:'manual'}
];
const FEATURES={sauna:'Sauna / Wellness',kitchen:'Küche',breakfast:'Frühstück inklusive',cancel:'Kostenlos stornierbar',quiet:'Ruhige Lage',accessible:'Barrierefrei',parking:'Parkplatz'};
const FEES={tax:'Kurtaxe',cleaning:'Endreinigung',parking:'Parkgebühr',wellness:'Wellnessgebühr',mandatory:'Weitere Pflichtzuschläge'};
function searchDefaults(t){return {version:1,destination:t.dest||(placeOf(t)||{}).name||'',maxPrice:'',maxDrive:'',minRating:'',type:'',provider:'',sort:'match',onlyFavorites:false,onlyCurrent:false,must:[],wish:['sauna','quiet'],providers:['booking','check24','fewo','airbnb']};}
function searchState(t){return Object.assign(searchDefaults(t),t.search||{});}
function migrateTrip(t){if(t.schemaVersion!=null&&t.schemaVersion!==2)throw new Error('Unbekannte Reiseversion');if(t.schemaVersion===2)return clone(t);const out=clone(t);out.schemaVersion=2;out.search=out.search||searchDefaults(out);out.offers=out.offers||[];out.searchProfiles=out.searchProfiles||[];return out;}
function safeOfferUrl(value){return /^https:\/\/[^\s<>"']+$/i.test(String(value||''))?String(value):'';}
function providerUrl(p,t,q){
 const dest=q.destination.trim();if(!dest)return p.home;
 const dates=t.dateMode==='fix'&&pd(t.start)&&pd(t.end)&&pd(t.end)>pd(t.start);
 const params=(obj)=>Object.entries(obj).filter(([,v])=>v!==''&&v!=null).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
 if(p.id==='booking')return 'https://www.booking.com/searchresults.de.html?'+params({ss:dest,checkin:dates?t.start:'',checkout:dates?t.end:'',group_adults:t.persons,no_rooms:1,group_children:0});
 if(p.id==='airbnb')return 'https://www.airbnb.de/s/'+encodeURIComponent(dest)+'/homes?'+params({checkin:dates?t.start:'',checkout:dates?t.end:'',adults:t.persons});
 if(p.id==='fewo')return 'https://www.fewo-direkt.de/search?'+params({destination:dest,startDate:dates?t.start:'',endDate:dates?t.end:'',adults:t.persons});
 return p.home;
}
function offerAmounts(o){
 const n=(pd(o.end)-pd(o.start))/864e5,p=Number(o.persons),b=Number(o.price);
 const base=b*(o.basis==='night'?n:o.basis==='personNight'?n*p:o.basis==='person'?p:1);
 let total=base,unknown=[];Object.entries(FEES).forEach(([k,label])=>{const fee=(o.fees||{})[k];if(!fee||fee.state==='unknown')unknown.push(label);else if(fee.state==='extra')total+=Number(fee.amount);});
 return {base,total,unknown,nights:n};
}
function offerCurrent(o,t,now){return o.start===t.start&&o.end===t.end&&+o.persons===+t.persons&&t.dateMode==='fix'&&(!o.validUntil||o.validUntil>=(now||new Date().toISOString().slice(0,10)));}
function offerEvaluation(o,t,q){
 const amounts=offerAmounts(o),failed=[],unknown=[];let points=0,possible=q.wish.length;
 q.must.forEach(k=>{if((o.features||{})[k]==='no')failed.push(FEATURES[k]);else if((o.features||{})[k]!=='yes')unknown.push(FEATURES[k]);});
 q.wish.forEach(k=>{if((o.features||{})[k]==='yes')points++;});
 if(q.maxPrice!==''){if(amounts.unknown.length)unknown.push('Vollständiger Preis');if(amounts.total>+q.maxPrice)failed.push('Unterkunftsbudget');}
 if(q.maxDrive!==''){if(o.drive==null)unknown.push('Fahrzeit');else if(o.drive>+q.maxDrive)failed.push('Fahrzeit');}
 if(q.minRating!==''){if(o.rating==null)unknown.push('Bewertung');else if(o.rating<+q.minRating)failed.push('Bewertung');}
 if(q.type&&o.type!==q.type)failed.push('Unterkunftsart');if(q.provider&&o.provider!==q.provider)failed.push('Anbieter');
 if(q.destination.trim()&&!String(o.location).toLocaleLowerCase('de').includes(q.destination.trim().toLocaleLowerCase('de')))failed.push('Suchort');
 if(o.availability==='unavailable')failed.push('Nicht verfügbar');
 if(q.onlyCurrent&&(!offerCurrent(o,t)||o.availability!=='available'))failed.push('Zeitraum / Verfügbarkeit');
 if(q.onlyFavorites&&!o.favorite)failed.push('Merkliste');
 return {amounts,failed,unknown,points,possible,match:failed.length===0&&unknown.length===0};
}
function filteredOffers(t,q){return (t.offers||[]).map(o=>({o,e:offerEvaluation(o,t,q)})).filter(x=>x.e.match).sort((a,b)=>q.sort==='price'?a.e.amounts.total-b.e.amounts.total:q.sort==='drive'?(a.o.drive==null?Infinity:a.o.drive)-(b.o.drive==null?Infinity:b.o.drive):q.sort==='rating'?(b.o.rating==null?-1:b.o.rating)-(a.o.rating==null?-1:a.o.rating):b.e.points-a.e.points||a.e.amounts.unknown.length-b.e.amounts.unknown.length||a.e.amounts.total-b.e.amounts.total);}
function validateOffer(o){
 if(!o||typeof o!=='object'||!/^o[a-z0-9]+$/i.test(o.id)||typeof o.name!=='string'||!o.name.trim()||o.name.length>160||typeof o.location!=='string'||!o.location.trim()||o.location.length>160||!PROVIDERS.some(p=>p.id===o.provider)||!['hotel','fewo','pension','other'].includes(o.type))throw new Error('Angebotsname, Ort, Anbieter und Unterkunftsart prüfen.');
 if(!pd(o.start)||!pd(o.end)||pd(o.end)<=pd(o.start)||!Number.isInteger(+o.persons)||+o.persons<1||+o.persons>20)throw new Error('Angebotszeitraum und Personen prüfen.');
 if(!['stay','night','person','personNight'].includes(o.basis)||o.price==null||o.price===''||!Number.isFinite(+o.price)||+o.price<0||+o.price>1e7)throw new Error('Preis und Preisbasis prüfen.');
 if(!safeOfferUrl(o.url)||!pd(o.checkedAt)||o.validUntil&&!pd(o.validUntil)||o.validUntil&&o.validUntil<o.checkedAt)throw new Error('HTTPS-Quelle, Prüfdatum und Gültigkeit prüfen.');
 if(!['unknown','available','unavailable'].includes(o.availability)||typeof o.terms!=='string'||o.terms.length>4000)throw new Error('Verfügbarkeit oder Bedingungen ungültig.');
 for(const k of Object.keys(FEATURES))if(!['yes','no','unknown'].includes((o.features||{})[k]))throw new Error('Angebotsmerkmale ungültig.');
 for(const k of Object.keys(FEES)){const f=(o.fees||{})[k];if(!f||!['included','extra','unknown'].includes(f.state)||f.state==='extra'&&(!Number.isFinite(+f.amount)||f.amount==null||f.amount===''||+f.amount<0||+f.amount>1e7))throw new Error('Gebühren prüfen: '+FEES[k]);}
 for(const k of ['paid','deposit'])if(o[k]==null||!Number.isFinite(+o[k])||+o[k]<0||+o[k]>1e9)throw new Error('Zahlungswerte prüfen.');
 if(o.drive!=null&&(!Number.isFinite(+o.drive)||+o.drive<0||+o.drive>10000)||o.rating!=null&&(!Number.isFinite(+o.rating)||+o.rating<0||+o.rating>10))throw new Error('Fahrzeit oder Bewertung prüfen.');
 if(+o.paid>offerAmounts(o).total)throw new Error('Bezahlt übersteigt die erfassten Kosten.');
 return o;
}

 t.schemaVersion=2;save(t);render();
 }catch(err){const box=$('#offer-error');if(box)box.textContent=err.message;else alertMsg(err.message);}
});

/* Optionale verschlüsselte Exportdatei: keine Änderung des lokalen Reiseformats. */
const SECURE_FORMAT='reiseplaner-encrypted-backup', SECURE_ITERATIONS=600000, MAX_BACKUP_BYTES=5*1024*1024, MAX_SECURE_FILE_BYTES=8*1024*1024;
function hasBackupCrypto(){return typeof crypto!=='undefined'&&crypto.subtle&&typeof crypto.getRandomValues==='function'&&typeof TextEncoder!=='undefined'&&typeof TextDecoder!=='undefined';}
function requireBackupCrypto(){if(!hasBackupCrypto())throw new Error('Passwortschutz ist hier nicht verfügbar. Planer über HTTPS oder localhost öffnen; Klartext-Sicherung bleibt möglich.');}
function bytesBase64(bytes){let out='';for(let i=0;i<bytes.length;i+=8192)out+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(out);}
function base64Bytes(value,max){if(typeof value!=='string'||value.length>Math.ceil(max/3)*4||!value.length||value.length%4||!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(value))throw new Error('Verschlüsselte Sicherung hat ungültige Daten.');const raw=atob(value),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));if(bytes.length>max||bytesBase64(bytes)!==value)throw new Error('Verschlüsselte Sicherung hat ungültige Daten.');return bytes;}
function secureHeader(raw){return new TextEncoder().encode(JSON.stringify([raw.format,raw.version,raw.cipher,raw.kdf,raw.iterations,raw.salt,raw.iv]));}
function validateSecureBackup(raw){
 if(!raw||raw.format!==SECURE_FORMAT||raw.version!==1||raw.cipher!=='AES-256-GCM'||raw.kdf!=='PBKDF2-SHA-256'||raw.iterations!==SECURE_ITERATIONS)throw new Error('Unbekanntes Passwortschutz-Format oder unzulässige Kryptoparameter.');
 const salt=base64Bytes(raw.salt,16),iv=base64Bytes(raw.iv,12),ciphertext=base64Bytes(raw.ciphertext,MAX_BACKUP_BYTES+16);
 if(salt.length!==16||iv.length!==12||ciphertext.length<16)throw new Error('Verschlüsselte Sicherung ist unvollständig.');
 return {salt,iv,ciphertext};
}
async function backupKey(password,salt){
 requireBackupCrypto();if(typeof password!=='string'||!password.length||password.length>1024)throw new Error('Bitte ein Passwort eingeben (maximal 1024 Zeichen).');
 const bytes=new TextEncoder().encode(password);
 try{const material=await crypto.subtle.importKey('raw',bytes,'PBKDF2',false,['deriveKey']);return await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:SECURE_ITERATIONS},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}finally{bytes.fill(0);}
}
async function encryptBackup(raw,password){
 requireBackupCrypto();validateBackup(raw);if(typeof password!=='string'||password.length<12||password.length>1024)throw new Error('Für eine neue Sicherung mindestens 12 Zeichen verwenden; eine lange, einzigartige Passphrase ist besser.');
 const plain=new TextEncoder().encode(JSON.stringify(raw));if(plain.length>MAX_BACKUP_BYTES)throw new Error('Sicherung ist zu groß (Inhalt maximal 5 MB).');
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const envelope={format:SECURE_FORMAT,version:1,cipher:'AES-256-GCM',kdf:'PBKDF2-SHA-256',iterations:SECURE_ITERATIONS,salt:bytesBase64(salt),iv:bytesBase64(iv)};
 try{const key=await backupKey(password,salt);const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:secureHeader(envelope),tagLength:128},key,plain);envelope.ciphertext=bytesBase64(new Uint8Array(encrypted));return envelope;}finally{plain.fill(0);}
}
async function decryptBackup(raw,password){
 requireBackupCrypto();const {salt,iv,ciphertext}=validateSecureBackup(raw);const key=await backupKey(password,salt);let plain;
 try{plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:secureHeader(raw),tagLength:128},key,ciphertext));}catch(err){throw new Error('Passwort falsch oder Sicherungsdatei beschädigt. Es wurde nichts importiert.');}
 try{if(plain.length>MAX_BACKUP_BYTES)throw new Error('Entschlüsselter Inhalt ist zu groß.');const data=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(plain));validateBackup(data);return data;}finally{plain.fill(0);}
}
function stableBackupValue(x){if(Array.isArray(x))return x.map(stableBackupValue);if(x&&typeof x==='object')return Object.fromEntries(Object.keys(x).sort().filter(k=>k!=='updated').map(k=>[k,stableBackupValue(x[k])]));return x;}
function importPreview(trips){
 const fields={title:'Titel',start:'Anreise',end:'Abreise',persons:'Personen',budget:'Budget',notes:'Notizen',stayId:'Unterkunft',items:'Tagesplan',offers:'Angebote',searchProfiles:'Suchprofile',search:'Suchfilter',check:'Checkliste'};
 return trips.map(t=>{const old=Store.get(t.id),incoming=migrateTrip(t),existing=old?migrateTrip(old):null,changed=existing?Object.entries(fields).filter(([k])=>JSON.stringify(stableBackupValue(existing[k]))!==JSON.stringify(stableBackupValue(incoming[k]))).map(([,label])=>label):[];
 const same=existing&&JSON.stringify(stableBackupValue(existing))===JSON.stringify(stableBackupValue(incoming));
 return {id:t.id,title:t.title,range:rangeText(t),persons:t.persons,items:t.items.length,offers:(t.offers||[]).length,profiles:(t.searchProfiles||[]).length,state:!old?'Neue Reise':same?'Bereits vorhanden · identischer Inhalt':'Bereits vorhanden · anderer Inhalt',changed};});
}
function acceptImport(raw,protectedFile){
 UI.importDraft=validateBackup(raw);UI.importProtected=!!protectedFile;UI.importInfo='Sicherungsformat v'+raw.version+(raw.version===1?' · wird auf v2 übernommen':'')+(typeof raw.exportedAt==='string'?' · Export: '+raw.exportedAt.slice(0,40):'');sheetImport();
}
async function readBackupFile(file){
 UI.secureJob=(UI.secureJob||0)+1;const read=UI.importRead=(UI.importRead||0)+1;UI.importDraft=null;UI.encryptedImport=null;
 if(file.size>MAX_SECURE_FILE_BYTES){alertMsg('Datei zu groß: maximal 8 MB, entschlüsselter Inhalt maximal 5 MB.');return;}
 try{const txt=await file.text();if(read!==UI.importRead)return;const raw=JSON.parse(txt);
 if(raw.format===SECURE_FORMAT){requireBackupCrypto();validateSecureBackup(raw);UI.encryptedImport=raw;openSheet('<h2>Passwortgeschützte Sicherung öffnen</h2><p>Die Datei wird nur in diesem Browser geöffnet. Danach könnt ihr die Reisen und Konflikte prüfen, bevor etwas importiert wird.</p><label class="fld"><span>Passwort der Sicherung</span><input type="password" id="secure-import-password" autocomplete="off" maxlength="1024"></label><div class="row"><button class="btn" data-secure-act="decrypt">Entschlüsseln & prüfen</button><button class="btn ghost" data-act="sheet-x">Abbrechen</button></div><p id="secure-error" role="alert"></p>');}
 else{if(file.size>MAX_BACKUP_BYTES)throw new Error('Unverschlüsselte Sicherung ist zu groß (maximal 5 MB).');acceptImport(raw,false);}
 }catch(err){if(read===UI.importRead){UI.importDraft=null;UI.encryptedImport=null;alertMsg('Import nicht möglich: '+err.message);}}
}
function secureBackupSheet(trips){
 try{requireBackupCrypto();const payload=backupData(trips);validateBackup(payload);UI.securePayload=payload;
 openSheet('<h2>Reisen mit Passwort sichern</h2><p>'+trips.length+' Reisen einschließlich Notizen, Angeboten und Suchprofilen. Verwendet eine lange, einzigartige Passphrase. Ohne Passwort lässt sich die Datei nicht wiederherstellen.</p><p class="small muted">Nur die heruntergeladene Datei wird verschlüsselt. Reisedaten und Sicherungspunkte im Browser bleiben unverschlüsselt. Das Passwort wird nicht gespeichert.</p><label class="fld"><span>Neues Passwort (mindestens 12 Zeichen)</span><input type="password" id="secure-export-password" minlength="12" maxlength="1024" autocomplete="new-password"></label><label class="fld"><span>Passwort wiederholen</span><input type="password" id="secure-export-repeat" maxlength="1024" autocomplete="new-password"></label><label><input type="checkbox" id="secure-understood"> Ich bewahre das Passwort getrennt auf. Es gibt keine Passwort-Wiederherstellung.</label><div class="row"><button class="btn" data-secure-act="encrypt">Verschlüsselte Datei herunterladen</button><button class="btn ghost" data-act="sheet-x">Abbrechen</button></div><p id="secure-error" role="alert"></p>');
 }catch(err){alertMsg(err.message);}
}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-secure-act]');if(!b)return;e.preventDefault();const act=b.getAttribute('data-secure-act');if(Store.corruptRaw!==null)return;
 if(act==='all'){secureBackupSheet(Store.list());return;}
 if(act==='trip'){const t=cur();if(t)secureBackupSheet([t]);return;}

 const payload=UI.securePayload;const promise=encryptBackup(payload,password);password='';$('#secure-export-password').value='';$('#secure-export-repeat').value='';if(box)box.textContent='Sicherung wird verschlüsselt …';const encrypted=await promise;if(job!==(UI.secureJob||0))return;
 downloadText(JSON.stringify(encrypted),'Reiseplaner-Passwort-Sicherung-'+new Date().toISOString().slice(0,10)+'.json','application/json');closeSheet();alertMsg('Verschlüsselte Datei zum Download bereit. Datei und Passwort getrennt aufbewahren.');}
 if(act==='decrypt'){let password=$('#secure-import-password').value;const envelope=UI.encryptedImport;const promise=decryptBackup(envelope,password);password='';$('#secure-import-password').value='';if(box)box.textContent='Datei wird entschlüsselt …';const raw=await promise;if(job!==(UI.secureJob||0))return;UI.encryptedImport=null;acceptImport(raw,true);}
 }catch(err){if(job===(UI.secureJob||0)&&box)box.textContent=err.message;}finally{if(job===(UI.secureJob||0))b.disabled=false;}

function conflictBlock(t){
  const m=Store.isAccount()&&Store.meta[t.id];if(!m)return '';
  if(m.lost)return '<section class="block"><div class="note" role="alert"><b>Kein Zugriff mehr auf die Online-Version dieser Reise.</b><p>Eure lokalen Änderungen sind nicht verloren. Ihr könnt sie als eigene neue Reise speichern oder verwerfen.</p><div class="row"><button type="button" class="btn sm" data-acc="conf" data-how="copy">Als eigene Reise speichern</button><button type="button" class="btn ghost sm" data-acc="conf" data-how="discard">Verwerfen</button></div></div></section>';
  if(m.failed&&Store.queue[t.id]&&m.failedAt===Store.queue[t.id].at)return '<section class="block"><div class="note" role="alert"><b>Speicherfehler online:</b><p>'+esc(m.failed)+'. Die Änderung ist lokal gespeichert. Bitte Eckdaten prüfen und erneut ändern.</p></div></section>';
  if(!m.conflict)return '';
  const r=m.conflict.remote,who=r&&r.updated_at?new Date(r.updated_at).toLocaleString('de-DE'):'';
  if(m.conflict.op==='deleted')return '<section class="block"><div class="note" role="alert"><b>Diese Reise wurde online gelöscht, während ihr sie geändert habt.</b><p>Eure Version kann als neue Reise gespeichert oder verworfen werden.</p><div class="row"><button type="button" class="btn sm" data-acc="conf" data-how="copy">Als neue Reise speichern</button><button type="button" class="btn ghost sm" data-acc="conf" data-how="discard">Verwerfen</button></div></div></section>';
  if(m.conflict.op==='delete')return '<section class="block"><div class="note" role="alert"><b>Löschen nicht ausgeführt:</b><p>Die Reise wurde zwischenzeitlich online geändert ('+esc(who)+').</p><div class="row"><button type="button" class="btn sm" data-acc="conf" data-how="server">Aktuelle Version behalten</button></div></div></section>';
  return '<section class="block"><div class="note" role="alert"><b>Gleichzeitige Bearbeitung:</b><p>Diese Reise wurde online geändert ('+esc(who)+', Version '+esc(r.version)+'), während ihr sie hier bearbeitet habt. Nichts wurde überschrieben.</p><div class="row"><button type="button" class="btn sm" data-acc="conf" data-how="server">Online-Version übernehmen</button><button type="button" class="btn ghost sm" data-acc="conf" data-how="copy">Meine Version als Kopie</button><button type="button" class="btn warn sm" data-acc="conf" data-how="mine">Meine Version speichern (überschreibt)</button></div></div></section>';
}

/* ================= Entdecken: Umkreis-Katalog (Issue #7) =================
   Ziele und Attraktionen nach Abfahrtsort und Kilometerbereich. Quelle: Datenbank (public.catalog_search),
   ohne Verbindung die gleiche Rechnung auf der Offline-Kopie catalog-data.js. Keine Preise, keine Öffnungszeiten.
   Abfahrtsort und Filter bleiben nur in diesem Browser (rp-entdecken), nicht in den Reisedaten. */
const CATX=window.RPCatalog||null;
const CAT_PREF_KEY='rp-entdecken';
function catDefaults(){return {origin:null,range:'tag',minKm:0,maxKm:150,kinds:[],month:'',nights:'',family:false,rainy:false}}
function catState(){
  if(!UI.cat){let p={};try{p=JSON.parse(localStorage.getItem(CAT_PREF_KEY)||'{}')||{}}catch(e){p={}}
    const d=catDefaults(),o=p.origin;
    UI.cat=Object.assign(d,{origin:o&&CATX&&CATX.validPoint(o)&&typeof o.label==='string'?{label:o.label.slice(0,80),lat:+o.lat,lon:+o.lon}:null,
      range:typeof p.range==='string'?p.range:d.range,minKm:Number.isFinite(+p.minKm)?+p.minKm:d.minKm,maxKm:Number.isFinite(+p.maxKm)&&+p.maxKm>0?+p.maxKm:d.maxKm,
      kinds:Array.isArray(p.kinds)?p.kinds.filter(k=>CATX&&CATX.KINDS[k]):[],month:/^([1-9]|1[0-2])?$/.test(String(p.month||''))?String(p.month||''):'',
      nights:/^\d{0,2}$/.test(String(p.nights??''))?String(p.nights??''):'',family:!!p.family,rainy:!!p.rainy},
      {res:null,busy:false,err:'',geoHits:null,geoBusy:false,index:{}});}
  return UI.cat;
}
function catSavePrefs(){const s=catState();try{localStorage.setItem(CAT_PREF_KEY,JSON.stringify({origin:s.origin,range:s.range,minKm:s.minKm,maxKm:s.maxKm,kinds:s.kinds,month:s.month,nights:s.nights,family:s.family,rainy:s.rainy}))}catch(e){}}
let catLocalData=null;
function catLoadLocal(){
  if(window.RP_CATALOG)return Promise.resolve(window.RP_CATALOG);
  if(catLocalData)return catLocalData;
  catLocalData=new Promise((res,rej)=>{const s=document.createElement('script');s.src='catalog-data.js';s.async=true;s.onload=()=>window.RP_CATALOG?res(window.RP_CATALOG):rej(new Error('Katalog leer'));s.onerror=()=>{catLocalData=null;rej(new Error('Offline-Katalog nicht geladen'))};document.head.appendChild(s)});
  return catLocalData;
}
function catTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('Zeitüberschreitung')),ms))])}
/* Datenbank zuerst; bei Fehler, fehlender Tabelle oder leerem Katalog die Offline-Kopie mit derselben Regel. */
async function catalogQuery(q){
  q={lat:+q.lat,lon:+q.lon,maxKm:Math.round(+q.maxKm),minKm:Math.round(+q.minKm||0),kinds:q.kinds||[]};
  CATX.checkQuery(q);
  const c=window.RPCloud;let dbErr='';
  if(c&&c.enabled()&&c.catalogSearch&&!(typeof navigator!=='undefined'&&navigator.onLine===false)){
    try{const r=await catTimeout(c.catalogSearch(q),8000);if(r&&r.version>0)return {source:'db',version:r.version,places:(r.places||[]).map(CATX.normPlace)};dbErr='Datenbank-Katalog noch leer'}
    catch(e){dbErr=e.message||'Datenbank nicht erreichbar'}
  }
  const r=CATX.searchLocal(await catLoadLocal(),q);
  return {source:'lokal',version:r.version,places:r.places,dbErr};
}

   '<h3>Vor Ort</h3><p class="small muted">Vorausgewählt ist, was in eure Reisezeit und Dauer passt. Häkchen setzen oder entfernen.</p><div class="checks-list">'+x.spots.map(sp=>catSpotRow({spot:sp,place:p,kind:'dest'},want.has(sp.id))).join('')+
   (x.closed?'<p class="small muted">'+x.closed+' weitere Idee(n) sind im gewählten Monat üblicherweise geschlossen und ausgeblendet.</p>':'')+'</div>'+
   '<h3>Unterwegs-Stopps</h3><div id="cat-stops"><p class="small" role="status">Suche Stopps auf dem Weg …</p></div>'+
   '<h3>Ausflüge vom Ziel aus</h3><div id="cat-near"><p class="small" role="status">Suche in der Umgebung …</p></div>'+
   '<div class="panel"><h3>Daraus eine Reise machen</h3><div class="form"><label class="fld"><span>Nächte</span><input type="number" min="0" max="30" id="cat-n" value="'+nights+'"></label><label class="fld"><span>Personen</span><input type="number" min="1" max="20" id="cat-p" value="2"></label></div>'+
   '<p class="small muted">Die Auswahl wird automatisch auf die Tage verteilt (Anreisetag nachmittags, Abreisetag vormittags, lange Touren ganztags, Drinnen-Ideen nachmittags). Preise bleiben offen, bis ihr sie eintragt. Fahrstrecke wird als Schätzung übernommen.</p>'+
   '<div class="row"><button type="button" class="btn" data-act="cat-create">Als neue Reise anlegen</button></div>'+
   (editable.length?'<div class="form"><label class="fld"><span>Oder zu bestehender Reise</span><select id="cat-trip">'+editable.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.title)+'</option>').join('')+'</select></label><div class="fld"><span>&nbsp;</span><button type="button" class="btn ghost" data-act="cat-add">Hinzufügen</button></div></div>':'')+'</div>');
  catExtras(x).catch(e=>{const a=$('#cat-stops'),b=$('#cat-near');if(a)a.innerHTML='<p class="small">'+esc(e.message)+'</p>';if(b)b.innerHTML=''});
}
/* Stopps und Ausflüge nachladen: zwei weitere Abfragen mit derselben Quelle */
async function catExtras(x){
  const s=catState(),p=x.place,id=p.id;
  const [way,around]=await Promise.all([
    catalogQuery({lat:s.origin.lat,lon:s.origin.lon,maxKm:Math.min(CATX.MAX_KM,x.roadKm+40),minKm:0}).catch(()=>({places:[]})),
    catalogQuery({lat:p.lat,lon:p.lon,maxKm:80,minKm:0}).catch(()=>({places:[]}))]);
  if(s.openId!==id)return;
  const stops=CATX.stopsAlong(way.places,s.origin,p),near=CATX.nearbyFrom(around.places,p,50).filter(n=>!stops.some(st=>st.spot.id===n.spot.id));
  stops.forEach(e=>{s.index[e.spot.id]={spot:e.spot,place:e.place,kind:'stop',detourKm:e.detourKm}});
  near.forEach(e=>{s.index[e.spot.id]={spot:e.spot,place:e.place,kind:'near',roadKm:e.roadKm}});
  const a=$('#cat-stops'),b=$('#cat-near');
  if(a)a.innerHTML=stops.length?'<p class="small muted">Liegen auf dem Weg, Umweg geschätzt. Werden am Anreisetag eingeplant.</p><div class="checks-list">'+stops.map(e=>catSpotRow(Object.assign({kind:'stop'},e),false)).join('')+'</div>':'<p class="small muted">'+(x.roadKm<80?'Für kurze Strecken keine Stopps.':'Keine Katalog-Idee nah genug an der Strecke.')+'</p>';
  if(b)b.innerHTML=near.length?'<div class="checks-list">'+near.map(e=>catSpotRow(Object.assign({kind:'near'},e),false)).join('')+'</div>':'<p class="small muted">Keine weiteren Katalog-Ideen im Umkreis von 50 km.</p>';
}
function catPicked(){const s=catState();return [...document.querySelectorAll('[data-cs]')].filter(c=>c.checked).map(c=>s.index[c.getAttribute('data-cs')]).filter(Boolean)}
/* Auswahl als eigene Unternehmungen mit Tagesgerüst in eine Reise übernehmen (nur additive Felder). */
function catApply(t,picked,nights){
  const acts={},main=[],stops=[];
  picked.forEach(e=>{const a=CATX.toAct(e.spot,e.place,uid);if(e.kind==='stop'){a.km=e.detourKm;a.note+=' Zwischenstopp, Umweg ca. '+e.detourKm+' km (geschätzt).';stops.push(a)}else{if(e.kind==='near'){a.km=e.roadKm*2;a.note+=' Ausflug vom Ziel, hin und zurück ca. '+e.roadKm*2+' km (geschätzt).'}main.push(Object.assign({},e.spot,{id:a.id,slot:e.spot.slot}))}acts[a.id]=a});
  t.customActs=(t.customActs||[]).concat(Object.values(acts));
  const plan=CATX.dayPlan(main,nights).map(i=>({uid:uid('i'),act:i.spotId,day:i.day,slot:i.slot}));
  const st=stops.map(a=>({uid:uid('i'),act:a.id,day:0,slot:'mittag'}));
  t.items=(t.items||[]).concat(st,plan);
  return {acts:Object.keys(acts).length,planned:plan.length+st.length};
}
function catTripType(p,nights,month){
  const m=+month||0;
  if(nights===0)return 'tag';
  if(p.kinds.includes('winter')&&[12,1,2,3].includes(m))return 'winter';
  if(p.kinds[0]==='stadt')return 'stadt';
  if(p.kinds.includes('wasser')&&[6,7,8].includes(m)&&nights>=4)return 'strand';
  return nights<=2?'wochenende':'rund';
}
function catCreate(){
  const s=catState(),x=s.res&&s.res.ranked.find(r=>r.place.id===s.openId);if(!x)return;
  const p=x.place,nights=Math.max(0,Math.min(30,Math.round(num($('#cat-n').value,0)))),persons=Math.max(1,Math.min(20,Math.round(num($('#cat-p').value,2))));
  const picked=catPicked();
  const t=newTrip({title:p.name,type:catTripType(p,nights,s.month),nights,persons,budget:0,origin:s.origin.label,dest:p.name+(p.region?', '+p.region:''),travel:'auto',km:x.roadKm,kmSrc:'schaetzung',
    destGeo:{lat:p.lat,lon:p.lon,place:p.id,v:s.res.version},
    notes:'Aus dem Umkreis-Katalog (Version '+s.res.version+', '+(s.res.source==='db'?'Datenbank':'Offline-Kopie')+'). '+p.summary+(p.angle?'\nIdee: '+p.angle:'')+'\nFahrstrecke '+x.roadKm+' km ist eine Schätzung; Preise und Öffnungszeiten vor Ort prüfen.'});
  if(s.month){t.dateMode='flex';t.month=catNextMonth(s.month)}
  const r=catApply(t,picked,nights);
  t.id=uid('t');save(t,true);closeSheet();go('r-'+t.id+'-plan');
  alertMsg('Reise angelegt: '+r.acts+' Ideen übernommen, '+r.planned+' davon eingeplant. Preise sind noch offen.');
}
function catAdd(){
  const s=catState(),t=Store.get($('#cat-trip').value);if(!t)return;
  if(Store.isAccount()&&!Store.canEdit(t.id)){alertMsg('Nur Leserecht für diese Reise.');return}
  const picked=catPicked();if(!picked.length){alertMsg('Keine Idee ausgewählt.');return}
  const r=catApply(t,picked,nightsOf(t));save(t);closeSheet();go('r-'+t.id+'-plan');
  alertMsg(r.acts+' Ideen zur Reise „'+t.title+'“ hinzugefügt.');
}
async function catSearch(surprise){
  const s=catState();if(!s.origin)return;
  s.busy=true;s.err='';render();
  try{
    const r=await catalogQuery({lat:s.origin.lat,lon:s.origin.lon,maxKm:s.maxKm,minKm:s.minKm,kinds:s.kinds});
    r.ranked=CATX.rank(r,{kinds:s.kinds,month:s.month,nights:s.nights===''?null:+s.nights,family:s.family,rainy:s.rainy});
    s.res=r;
  }catch(e){s.err=e.message;s.res=null}
  s.busy=false;catSavePrefs();render();
  if(s.res&&surprise){const pick=CATX.surprise(s.res.ranked);if(pick)catOpen(pick.place.id);else alertMsg('Im gewählten Bereich gibt es keine Ziele. Kilometer vergrößern oder Themen abwählen.')}
  else if(s.res){const el=document.getElementById('cat-results');if(el&&el.scrollIntoView)try{el.scrollIntoView({block:'start'})}catch(e){}}
}
async function catGeoSearch(text){
  text=String(text||'').trim();const s=catState();if(text.length<2){alertMsg('Bitte einen Ort oder eine Postleitzahl eingeben.');return}
  const low=text.toLowerCase(),local=CATX.ORIGINS.filter(o=>o.label.toLowerCase().startsWith(low));
  s.geoBusy=true;render();
  try{
    const r=await catTimeout(fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=de&countrycodes=de,at,ch,fr,it,nl,be,lu,cz,pl,dk&q='+encodeURIComponent(text),{headers:{Accept:'application/json'}}),8000);
    if(!r.ok)throw new Error('Ortssuche: Fehler '+r.status);
    const j=await r.json();
    s.geoHits=local.concat((Array.isArray(j)?j:[]).map(h=>({label:String(h.display_name||'').split(',').slice(0,3).join(',').trim().slice(0,80),lat:Math.round(+h.lat*1000)/1000,lon:Math.round(+h.lon*1000)/1000})).filter(h=>h.label&&CATX.validPoint(h))).slice(0,6);
  }catch(e){s.geoHits=local;if(!local.length)alertMsg('Ortssuche nicht erreichbar ('+e.message+'). Bitte eine Stadt aus der Liste wählen.')}
  s.geoBusy=false;render();
}
function catSetOrigin(o){const s=catState();s.origin={label:String(o.label).slice(0,80),lat:+o.lat,lon:+o.lon};s.geoHits=null;s.res=null;catSavePrefs();render()}
/* In einer Reise: weitere Katalog-Ideen rund um das Ziel */
async function catTripIdeas(t){
  const g=t.destGeo;if(!g||!CATX||!CATX.validPoint(g))return;
  openSheet('<span class="eyebrow">Umkreis-Katalog</span><h2>Mehr Ideen rund um '+esc(t.dest||t.title)+'</h2><div id="cat-trip-ideas"><p role="status">Suche …</p></div>');
  try{
    const r=await catalogQuery({lat:g.lat,lon:g.lon,maxKm:80,minKm:0});
    const have=new Set((t.customActs||[]).map(a=>a.catalogSpot).filter(Boolean)),s=catState();s.index={};
    const list=[];r.places.forEach(p=>p.spots.forEach(sp=>{if(have.has(sp.id))return;const d=CATX.airKm(g,sp);if(d<=50)list.push({spot:sp,place:p,kind:p.id===g.place?'dest':'near',roadKm:CATX.roadKm(d),d})}));
    list.sort((a,b)=>a.d-b.d);list.forEach(e=>{s.index[e.spot.id]=e});
    const el=$('#cat-trip-ideas');if(!el)return;
    el.innerHTML=list.length?catSourceLine(r)+'<div class="checks-list">'+list.slice(0,15).map(e=>catSpotRow(e,false)).join('')+'</div><div class="row"><button type="button" class="btn" data-act="cat-trip-add">Ausgewählte hinzufügen</button></div>':'<p>Alle Katalog-Ideen in der Nähe sind schon in dieser Reise.</p>';
  }catch(e){const el=$('#cat-trip-ideas');if(el)el.innerHTML='<p>'+esc(e.message)+'</p>'}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act^="cat-"]');if(!b||!CATX)return;
  const act=b.getAttribute('data-act'),val=b.getAttribute('data-val'),s=catState();
  switch(act){
    case 'cat-geo':
      if(!navigator.geolocation){alertMsg('Standort wird von diesem Browser nicht unterstützt. Bitte Ort eingeben.');return}
      s.geoBusy=true;render();
      navigator.geolocation.getCurrentPosition(pos=>{s.geoBusy=false;catSetOrigin({label:'Mein Standort (gerundet)',lat:Math.round(pos.coords.latitude*100)/100,lon:Math.round(pos.coords.longitude*100)/100})},
        err=>{s.geoBusy=false;render();alertMsg('Standort nicht verfügbar'+(err&&err.code===1?' (keine Freigabe)':'')+'. Bitte Ort eingeben oder aus der Liste wählen.')},{timeout:10000,maximumAge:600000});return;
    case 'cat-geo-search':catGeoSearch(($('#cat-q')||{}).value);return;
    case 'cat-pick':{const h=s.geoHits&&s.geoHits[+val];if(h)catSetOrigin(h);return}
    case 'cat-origin-clear':s.origin=null;s.res=null;catSavePrefs();render();return;
    case 'cat-range':{const r=CATX.RANGES.find(x=>x.id===val);if(r){s.range=r.id;s.minKm=r.min;s.maxKm=r.max;s.res=null;catSavePrefs();render()}return}
    case 'cat-kind':s.kinds=s.kinds.includes(val)?s.kinds.filter(k=>k!==val):s.kinds.concat([val]);s.res=null;catSavePrefs();render();return;
    case 'cat-family':s.family=!s.family;s.res=null;catSavePrefs();render();return;
    case 'cat-rainy':s.rainy=!s.rainy;s.res=null;catSavePrefs();render();return;
    case 'cat-search':catSearch(false);return;
    case 'cat-surprise':catSearch(true);return;
    case 'cat-open':catOpen(val);return;
    case 'cat-create':catCreate();return;
    case 'cat-add':catAdd();return;
    case 'cat-trip-ideas':{const t=cur();if(t)catTripIdeas(t);return}
    case 'cat-trip-add':{const t=cur();if(!t)return;const picked=catPicked();if(!picked.length){alertMsg('Keine Idee ausgewählt.');return}const r=catApply(t,picked.map(e=>Object.assign({},e,{kind:e.kind==='dest'?'dest':'near'})),nightsOf(t));save(t);closeSheet();render();alertMsg(r.acts+' Ideen hinzugefügt.');return}
  }
});
document.addEventListener('change',e=>{
  const el=e.target;if(!CATX)return;
  if(el.id==='cat-city'&&el.value!==''){const o=CATX.ORIGINS[+el.value];if(o)catSetOrigin(o);return}
  const f=el.getAttribute&&el.getAttribute('data-cf');if(!f)return;
  const s=catState();
  if(f==='minKm'||f==='maxKm'){const v=Math.max(0,Math.min(CATX.MAX_KM,Math.round(num(el.value,0))));s[f]=f==='maxKm'?Math.max(10,v):v;if(s.minKm>=s.maxKm){if(f==='minKm')s.maxKm=Math.min(CATX.MAX_KM,s.minKm+50);else s.minKm=Math.max(0,s.maxKm-50)}s.range=''}
  else if(f==='month'||f==='nights')s[f]=el.value;
  s.res=null;catSavePrefs();render();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='cat-q'){e.preventDefault();catGeoSearch(e.target.value)}});

<title>Reiseplaner</title>
<!-- Entwicklungsstand 1.4 · 13.10.2026
Grundlage: bereitgestellte Reiseplaner(1).html. Bestehender Speicherschlüssel rp-trips bleibt erhalten.
Neu: explizite Gästekartenbestätigung, gemeinsames Top-Leistungs-Tageslimit,
volle Reisedauer, datumsgebundenes Silvester, manuelle Strecke, offene Kosten,
Zurücksetzen unterkunftsgebundener Angaben, Speicherfehleranzeige, Eingabeprüfungen.
Manueller JSON-Export für einzelne/alle Reisen und Import mit Prüfung/Vorschau;
bei ID-Konflikt nur überspringen oder zusätzliche Kopie, nie überschreiben.
Logik- und Startansicht-Prüfungen in Node erfolgreich. Kein Browser-/iPhone-Test: Browserbinary nicht verfügbar.
Dateivorschau der ChatGPT-iPhone-App zeigt die Kopfzeile, führt die interaktive Oberfläche offenbar nicht zuverlässig aus.
Statische Lade-/Fehlermeldung hinzugefügt. Privates Hosting vorbereitet, Veröffentlichung wegen Netzwerkproxy-Fehler offen.
Keine Anbieterrecherche durchgeführt. Katalogangaben bleiben unbestätigt.
Offen: konkrete Angebote mit Gebühren/Preisbasen; Import bestehender Altdateien ohne Sicherungsformat;
Zahlungen und Kaution; genaue Termine und Reisezeiten; vollständige Quellennachweise;
Saisonprüfung der Vorlagen; Tarife bei >5 Verleihtagen; gemeinsame Nutzung mit Zugriffsschutz.
Lokaler Browser-Speicher ist keine Gerätesynchronisation. Bestehende Claude-DB-Anbindung unverändert.
v1.4: beschädigter lokaler Speicher wird nicht überschrieben; Rohdaten-Download und bewusstes Zurücksetzen.
v1.5: Unterwegs-Ansicht (heute/morgen), laufende Reise nicht mehr als „vorbei“, Reisemappe mit Druck/PDF,
Kalenderexport (.ics, grobe Zeitfenster, vorläufig) und Text zum Teilen. Kein neues Speicherfeld.
v1.6: Plan B bei schlechtem Wetter (Indoor-Ideen passend zu Datum/Katalogregeln), Offline-Start per Service Worker
(nur über http/https, Netz zuerst), App-Icon und Manifest für den Homescreen. Browser-Klicktest im Repo.
v1.7: Packliste aus dem Plan (Mitbringsel der geplanten Unternehmungen). Spartipps: keine Unterkunft ohne Sauna
empfehlen, wenn Sauna in der Unterkunft geplant ist; kein „frei mit PLUS“ ohne bestätigte Gästekarte.
v1.8: Verleih über 5 Tage nicht mehr gedeckelt (hochgerechnet), Skipass/Kurs ab Tag 4 als Schätzung markiert
und als offene Kosten benannt.
v1.9: Tagesausflug mit festem Datum (Anreise = Abreise, 0 Nächte); Reiseart „Tagesausflug“ setzt 0 Nächte;
ohne Übernachtung keine Unterkunftspflicht in Plan-Check, offenen Kosten und Checkliste.
Nächster Schritt: echter Browser-/iPhone-Klicktest, dann Angebots-/Kostenmodell und bezahlte/offene Beträge.
-->

<style>
/* Layout: App mit Kopfleiste. Reise-Bereiche als Wegweiser-Reiter. Raster für Unterkünfte, Unternehmungen und Tagesplan. Details öffnen als Blatt von unten. */
:root{
  --bg:#F7F4EE; --surface:#FFFEFB; --surface-2:#EDEBE2; --surface-3:#DDDCD0;
  --ink:#283B33; --muted:#606A60; --line:#D8DACE;
  --spruce:#345D4C; --spruce-soft:#E4EDE3;
  --sign:#EBC6AD; --sign-ink:#442D21;
  --ok:#276749; --warn:#8C551D; --bad:#AD3931; --blue:#315E8C;
  --c1:#345D4C; --c2:#54827E; --c3:#9A732F; --c4:#827194; --c5:#4A7650; --c6:#AE6546; --c7:#78867B;
  --f-display:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17211D; --surface:#202D26; --surface-2:#2B3930; --surface-3:#39493D;
  --ink:#F0F1E9; --muted:#B4BFB1; --line:#455346;
  --spruce:#ACD2BA; --spruce-soft:#2C4033;
  --sign:#E6BCA0; --sign-ink:#34251C;
  --ok:#5CC487; --warn:#E3A847; --bad:#F0736A; --blue:#79A6F2;
  --c1:#8CC2CF; --c2:#5FA3B5; --c3:#E0B93A; --c4:#A79BE0; --c5:#5CC487; --c6:#E8925F; --c7:#7E8D99; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17211D; --surface:#202D26; --surface-2:#2B3930; --surface-3:#39493D;
  --ink:#F0F1E9; --muted:#B4BFB1; --line:#455346;
  --spruce:#ACD2BA; --spruce-soft:#2C4033;
  --sign:#E6BCA0; --sign-ink:#34251C;
  --ok:#5CC487; --warn:#E3A847; --bad:#F0736A; --blue:#79A6F2;
  --c1:#8CC2CF; --c2:#5FA3B5; --c3:#E0B93A; --c4:#A79BE0; --c5:#5CC487; --c6:#E8925F; --c7:#7E8D99; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.05;margin:0}
h1{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:700}
h2{font-size:1.7rem;font-weight:700}
h3{font-size:1.2rem;font-weight:600}
h4{font-size:1.02rem;font-weight:600;letter-spacing:.02em}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.small{font-size:.87rem}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.78rem}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{max-width:62ch}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
section.block{display:flex;flex-direction:column;gap:14px;padding-block:20px;border-top:1px solid var(--line)}
section.block:first-child{border-top:0;padding-top:4px}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Kopf */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:4px 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-size:1.5rem;font-weight:700;letter-spacing:.01em}
.sync{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;min-height:36px;cursor:pointer;text-align:left}
.sync:hover{border-color:var(--line)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.sync.on i{background:var(--ok)}

/* Buttons */
.btn{cursor:pointer;border:0;border-radius:8px;background:var(--spruce);color:var(--bg);padding:10px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--spruce);border:1px solid var(--spruce)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn.warn{background:var(--bad);color:#fff}
.btn.sign{background:var(--sign);color:var(--sign-ink)}
.btn[disabled]{opacity:.5;cursor:default}
.lnk{display:inline-flex;align-items:center;min-height:36px;padding:6px 11px;border:1px solid var(--line);border-radius:8px;color:var(--spruce);text-decoration:none;font-weight:600;font-size:.88rem;background:var(--surface)}
.lnk:hover{border-color:var(--spruce)}
.chipbtn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:600;font-size:.9rem;min-height:38px}
.chipbtn[aria-pressed="true"]{background:var(--spruce);border-color:var(--spruce);color:var(--bg)}
.opt{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:.96rem;line-height:1.25;min-height:44px}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.opt[aria-pressed="true"]{border-color:var(--spruce);background:var(--spruce-soft);box-shadow:inset 0 0 0 2px var(--spruce)}
.opts{display:flex;flex-wrap:wrap;gap:8px}

/* Reiter als Wegweiser */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:thin;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:6px}
.tab{flex:none;cursor:pointer;border:0;background:var(--surface-2);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.03em;text-transform:uppercase;padding:8px 24px 8px 12px;clip-path:polygon(0 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,0 100%)}
.tab[aria-current="page"]{background:var(--sign);color:var(--sign-ink)}
.tab .n{font-family:var(--f-mono);font-size:.68rem;margin-left:4px;opacity:.75}

/* Karten & Raster */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.sel{border-color:var(--spruce);box-shadow:inset 0 0 0 2px var(--spruce)}
.card.click{cursor:pointer;text-align:left}
.card.click:hover{border-color:var(--spruce)}
.card .foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.price{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.note{background:var(--spruce-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:.94rem}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--ok)}.badge.est{color:var(--warn)}.badge.plus{color:var(--blue)}.badge.bad{color:var(--bad)}
.badge.cat{background:transparent;border:1px solid currentColor}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.1}
.kpi small{color:var(--muted);font-size:.82rem}
.sbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.sbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}

/* Checks */
.checks-list{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:.93rem}
.chk{flex-wrap:wrap}.dmore{margin-top:4px}.dmore>summary{font-size:.85rem;cursor:pointer;min-height:44px;display:flex;align-items:center}.dmore[open]>summary{margin-bottom:4px}.budget-bar{height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden;border:1px solid var(--line)}.budget-bar>span{display:block;height:100%;background:var(--accent,var(--ok))}.chk>span{flex:1 1 9em;min-width:0;overflow-wrap:anywhere}
.chk b{flex:none;font-family:var(--f-mono);font-size:.7rem;padding:2px 6px;border-radius:4px;margin-top:2px}
.chk.warn b{background:var(--warn);color:var(--bg)}.chk.info b{background:var(--surface-3)}.chk.ok b{background:var(--ok);color:var(--bg)}

/* Tagesplan-Raster */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.dcol{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.dhead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dhead b{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.dslot{padding:8px 10px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;min-height:64px}
.dslot:last-child{border-bottom:0}
.dslot .lbl{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.item{cursor:pointer;text-align:left;border:1px solid var(--line);border-left:4px solid var(--c7);border-radius:6px;background:var(--bg);padding:6px 8px;font-size:.88rem;line-height:1.25;display:flex;flex-direction:column;gap:2px}
.item small{color:var(--muted);font-size:.76rem}
.item.fixed{cursor:default;border-left-color:var(--sign);background:var(--surface-2)}
.item.warn{outline:2px solid var(--warn);outline-offset:-1px}
.add{cursor:pointer;border:1px dashed var(--line);background:transparent;border-radius:6px;padding:4px;color:var(--muted);font-size:.8rem}
.add:hover{border-color:var(--spruce);color:var(--spruce)}

/* Tabelle */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-weight:500;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.r,th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td small{display:block;color:var(--muted);font-size:.78rem}
tr.grp td{background:var(--surface-2);font-weight:700}
tr.total td{font-family:var(--f-display);font-size:1.35rem;font-weight:700;border-bottom:0}

/* Formulare */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=url],select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;width:100%;font-size:1rem;min-height:44px}
textarea{min-height:160px;resize:vertical;line-height:1.5}
.copybox{font-family:var(--f-body);font-size:.9rem;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;user-select:text}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* Blatt */
.sheet-bg{position:fixed;inset:0;background:rgba(10,18,24,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .x{align-self:flex-end;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-family:var(--f-mono);font-size:.75rem}
@media (min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:16px;max-height:84vh}}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dock .sum{font-family:var(--f-display);font-weight:700;font-size:1.4rem;white-space:nowrap}
.dock .nm{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw}
.dock .bar{flex:1}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
.facts dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.facts dd{margin:0}
.mdays{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.mday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
@media print{
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--surface:#fff;--surface-2:#f1f1f1;--surface-3:#e4e4e4;--ink:#000;--muted:#444;--line:#bbb;--spruce:#1E4D59;--spruce-soft:#eef3f5;--ok:#2C7A4B;--warn:#7a5210;--bad:#B8352B;--blue:#000;color-scheme:light}
  body{background:#fff;color:#000;font-size:12pt}
  .top,.tabs,.dock,#sheet-root,#msg,.noprint,.lnk{display:none!important}
  .wrap{max-width:none;padding:0}
  section.block{padding-block:10px}
  .mday,.facts,tr{break-inside:avoid}
}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* Reisebuch: gemeinsame Designbasis, siehe docs/DESIGN_CATALOG.md. */

/* ================= Reise-Logik ================= */
function nightsOf(t){if(t.dateMode==='fix'){const a=pd(t.start),b=pd(t.end);if(a&&b&&b>=a)return Math.round((b-a)/864e5)}return Math.max(0,Math.round(num(t.nights,3)))}
function daysOf(t){
  const n=nightsOf(t)+1, out=[], a=pd(t.start);
  for(let i=0;i<n;i++){
    if(t.dateMode==='fix'&&a){const d=new Date(a.getTime()+i*864e5);out.push({i,date:d,label:fmtD(d),md:iso(d).slice(5)})}
    else out.push({i,date:null,label:'Tag '+(i+1),md:''});
  }
  return out;
}
function rangeText(t){
  if(t.dateMode==='fix'){const a=pd(t.start),b=pd(t.end);if(a&&b)return fmtLong(a)+' – '+fmtLong(b)+' · '+nightsOf(t)+' Nächte'}
  if(t.dateMode==='flex'){const m=t.month?MONTHS[+t.month.slice(5,7)-1]+' '+t.month.slice(0,4):'Zeitraum offen';return m+' · '+nightsOf(t)+' Nächte (flexibel)'}

  Object.keys(pack).forEach(g=>groups.push(['Packliste: '+g,pack[g].map(x=>['p-'+x,x,''])]));
  const have=new Set([].concat(...Object.values(pack))),need={},maxDay=daysOf(t).length-1;
  sortedItems(t).forEach(it=>{const a=actOf(t,it.act);if(!a||it.day>maxDay)return;(a.bring||[]).forEach(x=>{if(have.has(x))return;(need[x]=need[x]||new Set()).add(a.t)})});

}

function importTrips(raw,conflictMode){
  if(Store.corruptRaw!==null)throw new Error('Import gesperrt: zuerst beschädigte Rohdaten sichern.');
  if(!['skip','copy'].includes(conflictMode))throw new Error('Unbekannte Importentscheidung.');
  const trips=validateBackup(raw), added=[], previous=Store.trips, next=clone(previous);
  for(const original of trips){
    if(next[original.id]&&conflictMode==='skip')continue;
    const t=clone(original);
    if(next[t.id]){do{t.id=uid('t')}while(next[t.id]);t.title=(t.title.slice(0,72)+' (Import)').slice(0,80);t.status='idee'}
    t.updated=Date.now();next[t.id]=t;added.push(t.id);
  }
  if(!added.length)return added;
  const prevQueue=Store.queue;
  Store.trips=next;if(Store.isAccount()){Store.queue=clone(prevQueue);added.forEach(id=>{Store.queue[id]={op:'upsert',at:Date.now()}})}
  if(!Store.saveLocal()){Store.trips=previous;Store.queue=prevQueue;throw new Error('Import nicht gespeichert. Bestehende Reisen blieben erhalten. Speicherproblem lösen und erneut versuchen.');}
  if(Store.isAccount())Sync.schedule(0);

}

function sampleAge(x,now=new Date()){

function stayNight(t,st,now=new Date()){

  const season=tripSeason(t),valid=(st.samples||[]).filter(x=>pd(x.from)&&pd(x.to)&&nightsBetween(x.from,x.to)>0&&Number.isFinite(x.total)&&x.total>0);

/* Budget-Übersicht und Rückblick (Claude, #8): rein abgeleitet aus cost(), Buchungsbuch und Angebot, keine Speicherfelder.
   „Fest“ = gebuchter Betrag eingetragen oder Status gebucht bzw. Unterkunft gebucht; alles andere bleibt Planwert. */
function budgetCheck(t,now){
  const c=cost(t),base=cost(Object.assign({},t,{ledger:{}})),f=financeSummary(t),b=num(t.budget,0),P=c.P,days=Math.max(1,daysOf(t).length);
  const cats={};const cat=k=>cats[k]=cats[k]||{key:k,label:(COSTCAT[k]||[k])[0],plan:0,now:0,fixed:0,paid:0};
  Object.keys(base.byCat).forEach(k=>{cat(k).plan=base.byCat[k]});
  Object.keys(c.byCat).forEach(k=>{cat(k).now=c.byCat[k]});
  f.rows.filter(r=>!r.orphan).forEach(r=>{const x=cat(r.cat||'eigen');if(r.amount!=null||r.status==='gebucht')x.fixed+=r.cost;x.paid+=r.paid});
  if(f.stay){const x=cat('unterkunft');if(f.stay.booked)x.fixed+=f.stay.cost;x.paid+=f.stay.paid}
  const list=Object.values(cats).filter(x=>x.plan>0.005||x.now>0.005||x.paid>0.005).sort((a,b2)=>b2.now-a.now);
  const fixed=list.reduce((s,x)=>s+Math.min(x.fixed,x.now||x.fixed),0),reserve=c.byCat.puffer||0;
  const devs=f.rows.filter(r=>!r.orphan&&r.amount!=null&&Math.abs(r.amount-r.plan)>=Math.max(5,r.plan*0.1)).map(r=>({label:r.label,plan:r.plan,actual:r.amount,diff:r.amount-r.plan})).sort((x,y)=>Math.abs(y.diff)-Math.abs(x.diff));
  const ph=tripPhase(t,now);
  return {budget:b,total:c.total,plan:base.total,fixed,estimated:Math.max(0,c.total-fixed-reserve),reserve,paid:f.paid,open:f.open,
    left:b?b-c.total:null,leftPerPersonDay:b?(b-c.total)/P/days:null,over:b>0&&c.total>b+0.005,share:b?c.total/b:null,
    cats:list,devs,unrecorded:f.rows.filter(r=>!r.orphan&&r.amount==null&&r.status!=='gebucht').length,
    phase:ph?ph.phase:null,P,days};
}

   (x.unrecorded?'<p class="small muted">'+x.unrecorded+' Posten ohne erfassten Betrag zählen weiter mit ihrem Planwert. Tatsächliche Beträge unter „Buchungen & Zahlungen“ nachtragen, damit der Rückblick stimmt.</p>':'<p class="small muted">Alle Posten haben einen erfassten Betrag.</p>'):'';
  const devs=x.devs.length?'<h3>Abweichungen vom Plan</h3><ul class="plain">'+x.devs.slice(0,6).map(d=>'<li>'+esc(d.label)+': geplant '+eur(d.plan)+', erfasst '+eur(d.actual)+' <b>('+(d.diff>0?'+':'−')+eur(Math.abs(d.diff))+(d.diff>0?' teurer':' günstiger')+')</b></li>').join('')+'</ul>':'';
  return '<section class="block" data-budget><h2>Budget</h2><p>'+head+'</p>'+bar+
   '<div class="kpis"><div class="kpi"><small>Fest</small><b class="num">'+eur(x.fixed)+'</b><small>gebucht oder Betrag erfasst</small></div><div class="kpi"><small>Noch geschätzt</small><b class="num">'+eur(x.estimated)+'</b><small>Planwerte, können sich ändern</small></div>'+(x.reserve?'<div class="kpi"><small>Puffer</small><b class="num">'+eur(x.reserve)+'</b><small>Reserve, kein fester Posten</small></div>':'')+'</div>'+

   devs+retro+'</section>';
}
function fileSafe(s){return String(s||'Reise').replace(/[^\wäöüÄÖÜß\- ]+/g,'').trim().replace(/\s+/g,'-').slice(0,60)||'Reise'}

/* ================= Speicher ================= */
/* Speicher mit getrennten Bereichen (Issue #6):
   * Gast: Schlüssel rp-trips (unverändert, wie bisher nur dieser Browser).
   * Konto: Schlüssel rp-u:<Benutzer-ID> mit {trips, meta, queue} als Offline-Cache. meta hält die zuletzt
     bestätigte Serverversion und Rolle, queue die noch nicht bestätigten Änderungen und Löschungen.
   Beim Wechsel des Bereichs wird der Arbeitsspeicher geleert, damit nie Daten eines anderen Kontos sichtbar bleiben. */
const Store={scope:'guest',trips:{},meta:{},queue:{},corruptRaw:null,
  key(){return this.scope==='guest'?'rp-trips':'rp-u:'+this.scope},
  historyKey(){return this.scope==='guest'?'rp-history':'rp-u:'+this.scope+':history'},
  isAccount(){return this.scope!=='guest'},
  setScope(scope){this.scope=scope||'guest';this.trips={};this.meta={};this.queue={};this.lastRaw=undefined;this.conflict=false;this.localError=false;this.corruptRaw=null;this.loadLocal()},
  serialize(){return this.scope==='guest'?JSON.stringify(this.trips):JSON.stringify({v:1,trips:this.trips,meta:this.meta,queue:this.queue})},
  loadLocal(){
    let raw;
    try{raw=localStorage.getItem(this.key());
      if(this.scope==='guest'){const s=JSON.parse(raw||'{}');if(!s||typeof s!=='object'||Array.isArray(s))throw new Error('Ungültige gespeicherte Reisen');Object.values(s).forEach(t=>{if(t&&typeof t==='object')validateExtras(t);});this.trips=s;}
      else{const s=JSON.parse(raw||'{"v":1,"trips":{},"meta":{},"queue":{}}');if(!s||s.v!==1||[s.trips,s.meta,s.queue].some(x=>!x||typeof x!=='object'||Array.isArray(x)))throw new Error('Ungültiger Kontospeicher');Object.values(s.trips).forEach(t=>validateExtras(t));this.trips=s.trips;this.meta=s.meta;this.queue=s.queue;}
      this.lastRaw=raw;this.corruptRaw=null;this.localError=false}
    catch(e){this.trips={};this.meta={};this.queue={};this.localError=true;if(raw!=null)this.corruptRaw=raw;setSync('storage-error')}
  },
  saveLocal(){
    if(this.corruptRaw!==null){this.localError=true;setSync('storage-error');return false}
    try{const raw=this.serialize(),previous=localStorage.getItem(this.key());
      if(this.lastRaw!==undefined&&previous!==this.lastRaw){this.localError=true;this.conflict=true;setSync('storage-error');alertMsg('Eine andere Ansicht hat neuere Daten gespeichert. Eigene Änderungen als Datei sichern und neu laden.');return false;}
      if(previous&&previous!==raw){try{let h=JSON.parse(localStorage.getItem(this.historyKey())||'[]');if(!Array.isArray(h))throw new Error('Sicherungspunkte ungültig');h.unshift({at:new Date().toISOString(),raw:previous});localStorage.setItem(this.historyKey(),JSON.stringify(h.slice(0,5)));this.historyError=false;}catch(e){this.historyError=true;}}
      localStorage.setItem(this.key(),raw);this.lastRaw=raw;this.conflict=false;this.localError=false;setSync();return true}
    catch(e){this.localError=true;setSync('storage-error');return false}
  },
  resetCorrupt(){
    if(this.corruptRaw===null)return false;
    try{localStorage.removeItem(this.key());this.corruptRaw=null;this.trips={};this.meta={};this.queue={};this.lastRaw=null;this.localError=false;setSync('local');return true}
    catch(e){this.localError=true;setSync('storage-error');return false}
  },
  list(){return Object.values(this.trips).sort((a,b)=>(a.start||a.month||'9999').localeCompare(b.start||b.month||'9999'))},
  get(id){return this.trips[id]||null},
  role(id){return this.isAccount()&&this.meta[id]&&this.meta[id].version?this.meta[id].role||'owner':'owner'},
  canEdit(id){return this.role(id)!=='viewer'},
  pending(){return Object.keys(this.queue).length},
  put(t,now){
    if(this.isAccount()&&this.meta[t.id]&&this.meta[t.id].unreadable){
      try{const s=JSON.parse(this.lastRaw||'{}');const old=s&&s.trips&&s.trips[t.id];if(old)this.trips[t.id]=old;else delete this.trips[t.id]}catch(e){}
      alertMsg(UNREADABLE_TXT+' Änderungen werden nicht gespeichert. Ihr könnt den lokalen Stand als eigene Reise behalten.');if(typeof render==='function')setTimeout(render,0);return false}
    if(this.isAccount()&&!this.canEdit(t.id)){const m=this.meta[t.id];if(m&&m.sv)this.trips[t.id]=JSON.parse(m.sv);alertMsg('Nur Leserecht: Änderungen an dieser Reise werden nicht gespeichert.');if(typeof render==='function')setTimeout(render,0);return false}
    t.updated=Date.now();this.trips[t.id]=t;
    if(this.isAccount()){const q=this.queue[t.id];this.queue[t.id]={op:'upsert',at:Date.now()};if(q&&q.op==='delete')this.queue[t.id].op='upsert';if(this.meta[t.id])delete this.meta[t.id].failed}
    if(!this.saveLocal())return false;
    if(this.isAccount())Sync.schedule(now?0:800);
    return true;
  },
  async remove(id){
    if(this.isAccount()){
      const m=this.meta[id];
      if(m&&m.unreadable)throw new Error(UNREADABLE_TXT+' Sie kann erst gelöscht werden, wenn diese App sie lesen kann (Seite neu laden).');
      if(m&&m.version&&this.role(id)!=='owner')throw new Error('Nur der Eigentümer kann die Reise löschen. Ihr könnt die Reise stattdessen verlassen.');
      delete this.trips[id];
      if(m&&m.version)this.queue[id]={op:'delete',at:Date.now()};else{delete this.queue[id];delete this.meta[id]}
      if(!this.saveLocal())return;Sync.schedule(0);return;
    }
    delete this.trips[id];this.saveLocal();
  }
};
/* Abgleich mit Supabase. Grundsätze: Nur der Server bestätigt "online gespeichert"; Änderungen werden nur
   mit der zuletzt bekannten Version geschrieben (atomar in der Datenbank); bei Abweichung entsteht ein
   sichtbarer Konflikt statt eines stillen Überschreibens. Löschungen werden als Markierung übertragen. */
const toServer=t=>{const d=migrateTrip(clone(t));d.schemaVersion=2;return d};
const Sync={state:'idle',error:'',timer:null,running:false,again:false,last:0,notice:'',
  cloud(){return typeof window!=='undefined'&&window.RPCloud&&window.RPCloud.enabled()?window.RPCloud:null},
  active(){return Store.isAccount()&&!!this.cloud()&&!!Auth.user&&Auth.user.id===Store.scope},
  schedule(ms){if(!this.active())return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(),ms==null?800:ms)},
  async run(){
    if(!this.active())return;
    if(this.running){this.again=true;return}
    if(typeof navigator!=='undefined'&&navigator.onLine===false){this.state='offline';setSync();return}
    const scope=Store.scope;this.running=true;this.state='syncing';setSync();
    let changed=false;
    try{changed=await this.push(scope);changed=(await this.pull(scope))||changed;if(Store.scope===scope){this.state='ok';this.error='';this.last=Date.now()}}
    catch(e){if(Store.scope===scope){this.state=e&&e.network?'offline':'error';this.error=e&&e.message||'Unbekannter Fehler'}}
    this.running=false;
    if(Store.scope===scope){Store.saveLocal();setSync();if(changed)remoteChanged()}
    if(this.again){this.again=false;this.run()}
  },
  /* Laufenden Abgleich abwarten und danach sicher neu abgleichen (z. B. nach Annahme einer Einladung). */
  async settle(){for(let i=0;i<200&&this.running;i++)await new Promise(r=>setTimeout(r,50));await this.run()},
  apply(row,role){const m=Store.meta[row.id]||{};Store.meta[row.id]={version:row.version,role:role||row.role||m.role||'owner',owner:row.owner_id,updatedAt:row.updated_at,sv:(role||row.role||m.role)==='viewer'?JSON.stringify(row.data):undefined}},
  async push(scope){
    const c=this.cloud();let changed=false;
    for(const id of Object.keys(Store.queue)){
      if(Store.scope!==scope)return changed;
      const q=Store.queue[id],m=Store.meta[id]||{};
      if(m.unreadable||m.conflict||m.lost||(m.failed&&m.failedAt===q.at))continue;
      if(q.op==='delete'){
        if(!m.version){delete Store.queue[id];delete Store.meta[id];continue}
        const row=await c.deleteTrip(id,m.version);if(Store.scope!==scope)return changed;
        if(row||!(await c.getTrip(id))){delete Store.queue[id];delete Store.meta[id];changed=true}
        else{const cur=await c.getTrip(id);if(cur&&cur.deleted_at){delete Store.queue[id];delete Store.meta[id]}else{Store.meta[id]=Object.assign(m,{conflict:{op:'delete',remote:cur}});changed=true}}
        continue;
      }
      const t=Store.trips[id];if(!t){delete Store.queue[id];continue}
      let data;try{data=toServer(t)}catch(e){Store.meta[id]=Object.assign(m,{failed:e.message,failedAt:q.at});continue}
      try{
        if(!m.version){
          let row;
          try{row=await c.insertTrip(id,data)}
          catch(e){if(String(e.code)!=='23505')throw e;
            /* Idempotenz: Anlegen kam evtl. schon an, nur die Antwort ging verloren → eigene Zeile übernehmen statt doppelt anlegen */
            const mine=await c.getTrip(id);if(Store.scope!==scope)return changed;
            if(mine&&mine.owner_id===Store.scope&&!mine.deleted_at){this.apply(mine,'owner');Store.meta[id].version=mine.version;const r2=await c.updateTrip(id,data,mine.version);if(r2)this.apply(r2,'owner');if(Store.queue[id]&&Store.queue[id].at===q.at)delete Store.queue[id];changed=true;continue}
            if(this.reassign(id)){changed=true;continue}throw e}
          if(Store.scope!==scope)return changed;this.apply(row,'owner');
        }else{
          const row=await c.updateTrip(id,data,m.version);if(Store.scope!==scope)return changed;
          if(row)this.apply(row);
          else{const cur=await c.getTrip(id);if(Store.scope!==scope)return changed;
            if(!cur)Store.meta[id]=Object.assign(m,{lost:true});
            else Store.meta[id]=Object.assign(m,{conflict:{op:cur.deleted_at?'deleted':'update',remote:cur}});
            changed=true;continue}
        }
        if(Store.queue[id]&&Store.queue[id].at===q.at)delete Store.queue[id];
      }catch(e){if(e&&e.network)throw e;if(/23514|22P02|22023|23502|check constraint/i.test(String(e.code)+' '+e.message)){Store.meta[id]=Object.assign(Store.meta[id]||{},{failed:e.message,failedAt:q.at});changed=true}else throw e}
    }
    return changed;
  },
  /* ID existiert bereits auf dem Server (z. B. dieselbe Sicherung in zwei Konten importiert): lokale Reise unter neuer ID weiterführen. */
  reassign(id){const t=Store.trips[id];if(!t)return null;let nid;do{nid=uid('t')}while(Store.trips[nid]);const n=clone(t);n.id=nid;Store.trips[nid]=n;Store.queue[nid]={op:'upsert',at:Date.now()};delete Store.trips[id];delete Store.queue[id];delete Store.meta[id];this.notice='Eine Reise bekam eine neue ID, weil die alte bereits vergeben war.';return nid},
  async pull(scope){
    const c=this.cloud(),rows=await c.listTrips(Store.scope);if(Store.scope!==scope)return false;
    let changed=false;const seen=new Set();
    for(const row of rows){
      seen.add(row.id);const q=Store.queue[row.id],m=Store.meta[row.id];
      if(!row.deleted_at&&(!m||m.version!==row.version||m.unreadable)){
        const bad=serverRowProblem(row);
        if(bad){Store.meta[row.id]=Object.assign(m||{},{unreadable:bad});if(!m||!m.version){Store.meta[row.id].role=row.role;Store.meta[row.id].owner=row.owner_id}changed=true;continue}
        if(m&&m.unreadable){delete m.unreadable;changed=true;if(!q){Store.trips[row.id]=clone(row.data);this.apply(row);continue}}
      }
      if(row.deleted_at&&m&&m.unreadable){delete m.unreadable;if(!Store.trips[row.id]&&!m.version){delete Store.meta[row.id];changed=true;continue}}
      if(row.deleted_at){
        if(q&&q.op==='upsert'){if(m&&m.version&&!m.conflict){m.conflict={op:'deleted',remote:row};changed=true}}
        else if(Store.trips[row.id]||m){delete Store.trips[row.id];delete Store.meta[row.id];delete Store.queue[row.id];changed=true}
        continue;
      }
      if(q){if(m)m.role=row.role;continue}
      if(!m||m.version!==row.version||!Store.trips[row.id]){
        Store.trips[row.id]=clone(row.data);this.apply(row);changed=true;
      }else if(m.role!==row.role){this.apply(row);changed=true}
    }
    for(const id of Object.keys(Store.meta)){const m=Store.meta[id];if(m&&m.unreadable&&!seen.has(id)&&!Store.trips[id]){delete Store.meta[id];changed=true}}
    for(const id of Object.keys(Store.trips)){const m=Store.meta[id];
      if(m&&m.version&&!seen.has(id)){if(Store.queue[id])m.lost=true;else{delete Store.trips[id];delete Store.meta[id];this.notice='Eine Reise ist nicht mehr für euch freigegeben und wurde von diesem Gerät entfernt.'}changed=true}}
    return changed;
  },
  /* Konfliktlösung durch den Benutzer */
  resolve(id,how){
    const m=Store.meta[id];if(!m)return;
    const remote=m.conflict&&m.conflict.remote;
    const remoteBad=m.unreadable||(remote&&!remote.deleted_at&&serverRowProblem(remote));
    if(remoteBad){
      if(how!=='copy')throw new Error(UNREADABLE_TXT+' Sie wird weder überschrieben noch übernommen. Den lokalen Stand könnt ihr als eigene Reise behalten.');
      const t=Store.trips[id];
      if(t){let nid;do{nid=uid('t')}while(Store.trips[nid]);const n=clone(t);n.id=nid;n.title=(String(t.title||'Reise').slice(0,64)+' (eigene Kopie)').slice(0,80);Store.trips[nid]=n;Store.queue[nid]={op:'upsert',at:Date.now()}}
      delete Store.trips[id];delete Store.queue[id];delete m.conflict;if(!m.unreadable)m.unreadable=remoteBad;

function planningNextSteps(t){
 const out=[],c=cost(t),f=financeSummary(t),o=activeOffer(t),load=dayLoad(t),oc=openCosts(t);
 const add=(id,priority,title,reason,tab,action='',value='',label='Ansehen')=>out.push({id,priority,title,reason,tab,action,value,label});
 const late=f.due.filter(r=>r.overdue),soon=f.due.filter(r=>!r.overdue&&r.days<=14);
 if(late.length)add('payments',10,'Überfällige Zahlung klären',late.length+' Posten mit offenem Betrag und vergangener Fälligkeit. Keine Zahlung wird automatisch ausgelöst.','kosten');
 else if(soon.length)add('payments',15,'Anstehende Zahlung prüfen',soon.length+' Posten werden innerhalb von 14 Tagen fällig.','kosten');
 if(f.detachedPaid>0)add('detached',12,'Zahlungen für entfernte Posten klären',eur(f.detachedPaid)+' sind keinem aktuellen Planposten zugeordnet. Erstattung oder verbleibende Kosten gesondert klären.','kosten');
 if(!placeOf(t)&&!String(t.dest||'').trim()&&!t.destGeo&&!(t.legs||[]).length)add('destination',20,'Ein Reiseziel wählen','Unterkunft, Ideen und Anfahrt lassen sich anschließend passend vergleichen.','unterkunft');
 if(t.dateMode!=='fix'||!pd(t.start)||!pd(t.end))add('dates',25,'Zeitraum konkretisieren','Ein offener oder flexibler Zeitraum reicht zum Ideen sammeln. Vor Angeboten und Buchungen konkrete Daten wählen.','','edit-trip');
 if(o&&(!offerCurrent(o,t)||o.availability!=='available'))add('offer',30,'Ausgewähltes Angebot erneut prüfen','Datum, Personen, Gültigkeit und Verfügbarkeit müssen zum Aufenthalt passen.','suche');
 if(nightsOf(t)>0&&!stayOf(t))add('stay',35,'Eine Unterkunft vergleichen','Für die Übernachtungen fehlt eine Unterkunft. Noch kein vollständiger Gesamtpreis.','suche');
 if(!String(t.origin||'').trim())add('origin',40,'Abfahrtsort ergänzen','Ohne Startort ist die Anfahrt nicht vollständig planbar.','','edit-trip');
 if(t.travel==='auto'&&(!routeKm(t)||t.kmSrc==='schaetzung'&&t.routeKm==null))add('route',45,'Fahrstrecke prüfen',routeKm(t)?'Die Kilometer sind geschätzt. Echte Strecke, Parken und Maut prüfen.':'Hin- und Rückfahrt brauchen eine Strecke ab eurem Startort.','kosten');
 if(num(t.budget,0)>0&&c.total>num(t.budget,0))add('budget',18,'Plan liegt über dem Budget',eur(c.total-num(t.budget,0))+' über der Vorgabe – zusätzlich können noch Kosten offen sein.','kosten');
 else if(!num(t.budget,0))add('budget',55,'Gesamtbudget festlegen','Eine Obergrenze hilft beim Vergleich; Kosten ohne Budget sind weiterhin Planwerte.','','edit-trip');
 if(oc.length)add('costs',50,'Offene Kosten und Gebühren prüfen',oc.slice(0,3).join(' · ')+(oc.length>3?' · '+(oc.length-3)+' weitere Hinweise in den Kosten':''),'kosten');
 const gaps=activityGaps(t).filter(x=>x.planned),prices=gaps.filter(x=>x.price),price=prices.find(x=>!x.locked);
 if(prices.length)add('activity-prices',42,'Preise der Unternehmungen ergänzen',prices.length+' eingeplante Idee(n) ohne Preis.'+(price?' Beginnt mit „'+price.act.t+'“.':' Bestehende Verpflichtungen zunächst im Zahlungsbuch klären.'),'kosten',price?'act-view':'',price?price.act.id:'',price?'Preis eintragen':'Zahlungsbuch prüfen');
 const busy=load.filter(d=>d.over),unknown=load.reduce((n,d)=>n+d.unknown,0);
 if(busy.length)add('load',32,'Überladene Tage entlasten',busy.length+' Tag(e) haben mehr Programm als nach geschätzter Fahrtzeit verfügbar ist. Pausen und Wege zusätzlich prüfen.','plan');
 if(unknown){const duration=gaps.find(x=>x.duration&&x.act.custom&&!x.locked);add('duration',65,'Dauer der Unternehmungen prüfen',unknown+' eingeplante Punkt(e) ohne bekannte Dauer. Freie Zeit ist dadurch nicht bestätigt.'+(duration?' Ergänzt zuerst „'+duration.act.t+'“.':''),'unternehmen',duration?'act-edit':'',duration?duration.act.id:'',duration?'Dauer ergänzen':'Unternehmungen prüfen');}
 if(!(t.items||[]).length)add('ideas',80,'Ein Highlight sammeln','Optional: eine passende Idee wählen und Erholungszeit frei lassen. Ihr müsst den Tagesplan nicht füllen.','unternehmen');
 return out.sort((a,b)=>a.priority-b.priority||a.id.localeCompare(b.id));
}

function customActFromForm(f,id){
  const title=String(f.title||'').trim(),price=String(f.cost==null?'':f.cost).trim(),duration=String(f.hours==null?'':f.hours).trim();
  if(!title||title.length>80)throw new Error('Bitte einen Titel mit höchstens 80 Zeichen eintragen.');
  if(!Object.hasOwn(CAT,f.cat))throw new Error('Bitte eine gültige Kategorie wählen.');
  if(!['pp','grp'].includes(f.per))throw new Error('Bitte eine gültige Preisbasis wählen.');
  if(price!==''&&(!Number.isFinite(Number(price))||Number(price)<0||Number(price)>1e9))throw new Error('Bitte einen gültigen, nicht negativen Preis eintragen.');
  if(price!==''&&Number(price)===0&&!f.free)throw new Error('Bei bestätigtem Gratis-Angebot bitte „Ist kostenlos“ wählen. Sonst den Preis offen lassen.');
  if(f.free&&price!==''&&Number(price)>0)throw new Error('Preis und „Ist kostenlos“ widersprechen sich. Bitte eines davon wählen.');
  if(duration!==''&&(!Number.isFinite(Number(duration))||Number(duration)<=0||Number(duration)>24))throw new Error('Dauer muss über 0 und höchstens 24 Stunden sein; unbekannte Dauer leer lassen.');
  const link=String(f.link||'').trim();
  if(link&&!/^https?:\/\//i.test(link))throw new Error('Link muss mit https:// oder http:// beginnen.');
  const bring=String(f.bring||'').split('\n').map(x=>x.trim()).filter(Boolean);
  if(bring.length>10||bring.some(x=>x.length>80))throw new Error('Höchstens 10 Packhinweise mit je 80 Zeichen eintragen, einen pro Zeile.');
  const a={id,custom:true,t:title,cat:f.cat,cost:f.free?0:price===''?0:Number(price),costOpen:!f.free&&price==='',per:f.per,dur:duration?'ca. '+String(Number(duration)).replace('.',',')+' Std.':'',indoor:!!f.indoor,bring:Array.from(new Set(bring)),link,note:String(f.note||'').trim(),slot:'nachm'};
  if(duration!=='')a.hours=Number(duration);
  return a;
}

function activityChangePreview(t,id,form,remove=false){
  const old=(t.customActs||[]).find(a=>a.id===id);
  if(!old)throw new Error('Diese eigene Unternehmung existiert nicht mehr.');
  if(old.transit)throw new Error('Weiterfahrt gehört zur Rundreise und kann hier nicht geändert werden.');
  const candidate=clone(t),index=candidate.customActs.findIndex(a=>a.id===id);
  if(remove){
    if(activityCommitted(t,id))throw new Error('Nicht gelöscht: Buchung, Anfrage, Zahlung oder Fälligkeit vorhanden. Zuerst Verpflichtung im Zahlungsbuch klären.');
    candidate.customActs.splice(index,1);candidate.items=(candidate.items||[]).filter(i=>i.act!==id);
  }else{
    const legacyZero=old.hours===0&&String(form.hours)==='0';
    const fresh=customActFromForm(legacyZero?Object.assign({},form,{hours:''}):form,id),next=Object.assign({},old,fresh);
    if(legacyZero){fresh.hours=0;next.hours=0;next.dur=old.dur||'';}
    if(fresh.hours==null){delete next.hours;if(old.hours==null)next.dur=old.dur||'';}
    const fixed=['t','cat','cost','costOpen','per','hours','dur'];
    if(activityCommitted(t,id)&&fixed.some(k=>JSON.stringify(old[k]??(k==='costOpen'?false:null))!==JSON.stringify(next[k]??(k==='costOpen'?false:null))))throw new Error('Titel, Kategorie, Preis und Dauer sind bei einer Verpflichtung geschützt. Notiz, Link, Indoor und Packhinweise können ergänzt werden.');
    candidate.customActs[index]=next;
  }
  return {trip:t.id,id,remove,source:JSON.stringify(t),candidate,before:cost(t).total,after:cost(candidate).total,count:(t.items||[]).filter(i=>i.act===id).length};
}

function departurePlan(t,now){
  const a=pd(t.start);if(t.dateMode!=='fix'||!a)return null;
  const today=todayUTC(now),todayIso=iso(today),startIso=iso(a),out=[],undated=[];
  const add=(date,kind,label,detail,go)=>{if(!date)return;out.push({date,kind,label,detail:detail||'',go:go||'',overdue:date<todayIso,days:Math.round((pd(date)-today)/864e5)})};
  const f=financeSummary(t);
  f.due.forEach(d=>add(d.due,'zahlung','Zahlung fällig: '+d.label,eur(d.open)+' offen','kosten'));
  const o=activeOffer(t);
  if(o&&!o.booked&&o.validUntil&&pd(o.validUntil))add(o.validUntil,'angebot','Angebot gilt bis: '+o.name,'Danach Preis und Verfügbarkeit neu prüfen','angebote');
  const g=checklist(t),chk=t.check||{};
  let packAll=0,packOpen=0;g.forEach(x=>{if(/^Packliste/.test(x[0]))x[1].forEach(i=>{packAll++;if(!chk[i[0]])packOpen++})});
  const pack=new Date(a.getTime()-864e5);
  if(packAll&&iso(pack)>=todayIso)add(iso(pack),'packen','Packen',packOpen?packOpen+' von '+packAll+' Punkten offen · Ausweise und Versicherungskarten bereitlegen':'Packliste vollständig abgehakt','check');
  if(t.type==='winter'&&t.travel==='auto'){const w=new Date(a.getTime()-7*864e5);if(iso(w)>=todayIso)add(iso(w),'auto','Auto winterfest?','Winterreifen, Schneeketten, Frostschutz prüfen')}
  add(startIso,'abfahrt','Abfahrt'+(t.departTime?' um '+t.departTime:''),t.origin?'ab '+t.origin:'');
  (g[0]?g[0][1]:[]).forEach(i=>{if(!chk[i[0]])undated.push({label:i[1],detail:i[2]||'',go:'check'})});
  out.sort((x,y)=>x.date.localeCompare(y.date)||(x.kind==='abfahrt')-(y.kind==='abfahrt'));
  return {items:out,undated,daysLeft:Math.round((a-today)/864e5)};
}

function dayCosts(t){
  const c=cost(t),n=daysOf(t).length,out=Array.from({length:n},(_,i)=>({day:i,direct:0,shared:0,total:0,open:0}));

    if(l.day!=null){put(l.day,l.c,false);return}
    if(l.days&&l.days.length)l.days.forEach(d=>put(d,l.c/l.days.length,true));

  out.forEach(x=>{x.direct=Math.round(x.direct*100)/100;x.shared=Math.round(x.shared*100)/100;x.total=Math.round((x.direct+x.shared)*100)/100});

function notesLinks(text){

function render(){

    v.innerHTML=UI.view==='neu'?vNeu():UI.view==='reise'?vReise():UI.view==='konto'?vKonto():UI.view==='entdecken'?vEntdecken():vReisen();
    document.querySelectorAll&&document.querySelectorAll('.app-nav [data-go]').forEach(b=>{if(b.getAttribute('data-go')===(UI.view==='entdecken'?'entdecken':UI.view==='konto'?'konto':'reisen'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});

function renderDock(){

  d.hidden=false;$('#dock-nm').textContent=t.title;$('#dock-sum').textContent=eur(c.total)+(b?' / '+eur(b):'');
  const bar=$('#dock-bar');bar.className='bar'+(b&&c.total>b?' bad':b&&c.total>b*.92?' warn':'');bar.querySelector('i').style.width=(b?Math.min(100,c.total/b*100):0)+'%';

let sheetOpener=null,sheetScroll=null;
/* Nur an den Dialoggrenzen umschalten; die normale Tab-Reihenfolge bleibt erhalten. */
function sheetTabTarget(nodes,current,backwards){
 if(!nodes.length)return null;
 const first=nodes[0],last=nodes[nodes.length-1];
 if(!nodes.includes(current))return backwards?last:first;
 if(backwards&&current===first)return last;
 if(!backwards&&current===last)return first;
 return null;
}
function openSheet(html){

 if(document.body&&document.body.style&&sheetScroll===null){sheetScroll=document.body.style.overflow||'';document.body.style.overflow='hidden'}

 $('#sheet-root').innerHTML='<div class="sheet-bg" data-act="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><button type="button" class="x" data-act="sheet-x">Schließen ✕</button>'+html+'</div></div>';
 const s=$('.sheet');if(!s)return;
 const title=s.querySelector('h1,h2');
 if(title){title.id='rp-sheet-title';s.setAttribute('aria-labelledby',title.id)}else s.setAttribute('aria-label','Details');
 if(s.focus)s.focus();
}
function closeSheet(){
 UI.routeEndpointDraft=null;UI.savingDraft=null;UI.secureJob=(UI.secureJob||0)+1;UI.importRead=(UI.importRead||0)+1;UI.securePayload=null;UI.encryptedImport=null;UI.importDraft=null;
 $('#sheet-root').innerHTML='';const opener=sheetOpener;sheetOpener=null;
 if(sheetScroll!==null&&document.body&&document.body.style){document.body.style.overflow=sheetScroll;sheetScroll=null}
 if(opener&&opener.isConnected!==false&&opener.focus)opener.focus();
 else if(opener){const view=$('#view');if(view&&view.focus)view.focus()}
}
function sheetKeydown(e){
 const sheet=$('.sheet');if(!sheet)return;
 if(e.key==='Escape'){e.preventDefault();closeSheet();return}
 if(e.key!=='Tab')return;
 const nodes=Array.from(sheet.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])')).filter(el=>el.tabIndex>=0&&!el.closest('[hidden],[inert]')&&el.getClientRects().length);
 const target=sheetTabTarget(nodes,document.activeElement,e.shiftKey);
 if(target){e.preventDefault();target.focus()}else if(!nodes.length){e.preventDefault();sheet.focus()}
}

function setField(obj,f,v){
  if(['persons','nights','budget','km','routeKm','ticket','verb','preis','stayQuote'].includes(f)&&num(v,0)<0){alertMsg('Negative Werte sind nicht erlaubt.');return;}
  if(['persons','nights'].includes(f)){obj[f]=Math.max(f==='persons'?1:0,Math.round(num(v,0)));return;}
  if(['persons','nights','budget','km','routeKm','ticket'].includes(f)){obj[f]=Math.max(0,num(v,0));if(f==='km'){delete obj.kmSrc;delete obj.routeMin;delete obj.routeHomeMin;delete obj.routeAt}}
  else if(['verb','preis'].includes(f)) obj[f]=num(v,f==='verb'?7.5:2.15);
  else if(f==='stayQuote') obj[f]=num(v,0)>0?num(v,0):null;
  else if(f==='tz'){if(v===''||!validTz(v))delete obj.tz;else obj.tz=v;}
  else if(f==='departTime'||f==='checkinTime'){if(v==='')delete obj[f];else if(TIME_RE.test(v))obj[f]=v;else alertMsg('Bitte eine gültige Uhrzeit (HH:MM) eingeben.');}
  else{if(obj[f]!==v){if(f==='origin')delete obj.originGeo;if(f==='dest')delete obj.destGeo}obj[f]=v;}
}

const SECURE_FORMAT='reiseplaner-encrypted-backup', SECURE_ITERATIONS=600000, MAX_BACKUP_BYTES=5*1024*1024, MAX_SECURE_FILE_BYTES=8*1024*1024;
function hasBackupCrypto(){return typeof crypto!=='undefined'&&crypto.subtle&&typeof crypto.getRandomValues==='function'&&typeof TextEncoder!=='undefined'&&typeof TextDecoder!=='undefined';}
function requireBackupCrypto(){if(!hasBackupCrypto())throw new Error('Passwortschutz ist hier nicht verfügbar. Planer über HTTPS oder localhost öffnen; Klartext-Sicherung bleibt möglich.');}
function bytesBase64(bytes){let out='';for(let i=0;i<bytes.length;i+=8192)out+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(out);}
function base64Bytes(value,max){if(typeof value!=='string'||value.length>Math.ceil(max/3)*4||!value.length||value.length%4||!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(value))throw new Error('Verschlüsselte Sicherung hat ungültige Daten.');const raw=atob(value),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));if(bytes.length>max||bytesBase64(bytes)!==value)throw new Error('Verschlüsselte Sicherung hat ungültige Daten.');return bytes;}
function secureHeader(raw){return new TextEncoder().encode(JSON.stringify([raw.format,raw.version,raw.cipher,raw.kdf,raw.iterations,raw.salt,raw.iv]));}
function validateSecureBackup(raw){
 if(!raw||raw.format!==SECURE_FORMAT||raw.version!==1||raw.cipher!=='AES-256-GCM'||raw.kdf!=='PBKDF2-SHA-256'||raw.iterations!==SECURE_ITERATIONS)throw new Error('Unbekanntes Passwortschutz-Format oder unzulässige Kryptoparameter.');
 const salt=base64Bytes(raw.salt,16),iv=base64Bytes(raw.iv,12),ciphertext=base64Bytes(raw.ciphertext,MAX_BACKUP_BYTES+16);
 if(salt.length!==16||iv.length!==12||ciphertext.length<16)throw new Error('Verschlüsselte Sicherung ist unvollständig.');
 return {salt,iv,ciphertext};
}
async function backupKey(password,salt){
 requireBackupCrypto();if(typeof password!=='string'||!password.length||password.length>1024)throw new Error('Bitte ein Passwort eingeben (maximal 1024 Zeichen).');
 const bytes=new TextEncoder().encode(password);
 try{const material=await crypto.subtle.importKey('raw',bytes,'PBKDF2',false,['deriveKey']);return await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:SECURE_ITERATIONS},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}finally{bytes.fill(0);}
}
async function encryptBackup(raw,password){
 requireBackupCrypto();validateBackup(raw);if(typeof password!=='string'||password.length<12||password.length>1024)throw new Error('Für eine neue Sicherung mindestens 12 Zeichen verwenden; eine lange, einzigartige Passphrase ist besser.');
 const plain=new TextEncoder().encode(JSON.stringify(raw));if(plain.length>MAX_BACKUP_BYTES)throw new Error('Sicherung ist zu groß (Inhalt maximal 5 MB).');
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const envelope={format:SECURE_FORMAT,version:1,cipher:'AES-256-GCM',kdf:'PBKDF2-SHA-256',iterations:SECURE_ITERATIONS,salt:bytesBase64(salt),iv:bytesBase64(iv)};
 try{const key=await backupKey(password,salt);const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:secureHeader(envelope),tagLength:128},key,plain);envelope.ciphertext=bytesBase64(new Uint8Array(encrypted));return envelope;}finally{plain.fill(0);}

async function decryptBackup(raw,password){
 requireBackupCrypto();const {salt,iv,ciphertext}=validateSecureBackup(raw);const key=await backupKey(password,salt);let plain;
 try{plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:secureHeader(raw),tagLength:128},key,ciphertext));}catch(err){throw new Error('Passwort falsch oder Sicherungsdatei beschädigt. Es wurde nichts importiert.');}

}
function stableBackupValue(x){if(Array.isArray(x))return x.map(stableBackupValue);if(x&&typeof x==='object')return Object.fromEntries(Object.keys(x).sort().filter(k=>k!=='updated').map(k=>[k,stableBackupValue(x[k])]));return x;}

const FAV_FORMAT='reiseplaner-merkliste';
function favClean(f){if(!f||typeof f!=='object'||typeof f.id!=='string'||!/^[a-z0-9-]{2,40}$/.test(f.id)||!CATX||!CATX.validPoint(f))return null;
  return {id:f.id,name:String(f.name||f.id).slice(0,120),region:String(f.region||'').slice(0,80),lat:+f.lat,lon:+f.lon,months:Array.isArray(f.months)?f.months.filter(m=>Number.isInteger(m)&&m>=1&&m<=12).slice(0,12):[],added:/^\d{4}-\d{2}-\d{2}$/.test(f.added||'')?f.added:iso(todayUTC())}}
function favExportData(list){return {format:FAV_FORMAT,version:1,exportedAt:new Date().toISOString(),items:list.map(favClean).filter(Boolean)}}
/* Zusammenführen: vorhandene Einträge behalten, neue anhängen, keine Dubletten, höchstens 100. Gibt {list, added, skipped} zurück. */
function favMerge(current,raw){
  if(!raw||raw.format!==FAV_FORMAT||raw.version!==1||!Array.isArray(raw.items))throw new Error('Keine Reiseplaner-Merkliste.');
  if(raw.items.length>500)throw new Error('Die Datei enthält zu viele Einträge.');
  const list=current.slice(),ids=new Set(list.map(f=>f.id));let added=0,skipped=0;
  raw.items.forEach(x=>{const f=favClean(x);if(!f||ids.has(f.id)||list.length>=100){skipped++;return}list.push(f);ids.add(f.id);added++});
  return {list,added,skipped};
}
function favText(list){return 'Merkliste „Irgendwann mal“ (Reiseplaner)\n'+list.map(f=>'• '+f.name+(f.region?' ('+f.region+')':'')+' – '+catShareUrl(f.id)).join('\n')}
function catFind(id){const s=catState();return (s.res&&s.res.ranked.find(r=>r.place.id===id))||s.extra[id]||null}
/* Ein einzelnes Ziel (Merkliste, Rundreise) nachladen und wie ein Suchtreffer bewerten */
async function catLoadPlace(id,lat,lon){
  const s=catState();if(catFind(id))return catFind(id);
  const r=await catalogQuery({lat,lon,maxKm:10,minKm:0});const p=r.places.find(q=>q.id===id);
  if(!p)throw new Error('Ziel ist nicht mehr im Katalog.');
  p.airKm=Math.round(CATX.airKm(s.origin,p)*10)/10;
  const x=catRank({version:r.version,source:r.source,places:[p]})[0];s.extra[id]=x;return x;
}
function catPrefs(){const s=catState();return {kinds:s.kinds,month:s.month,nights:s.nights===''?null:+s.nights,family:s.family,rainy:s.rainy}}
/* Mini-Karte der Treffer: Start in der Mitte, Kreise im Kilometerabstand (Luftlinie). Kein Kartendienst, funktioniert offline. */
function catMap(list,origin){
  if(!list.length)return '';
  const more=list.length>20;list=list.slice(0,20);
  const W=340,H=230,L=CATX.mapLayout(origin,list.map(x=>x.place),W,H);
  return '<figure class="catmap"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Lage der Ziele rund um den Abfahrtsort; Nummern wie in der Liste">'+
   L.rings.map(r=>'<circle cx="'+L.origin.x+'" cy="'+L.origin.y+'" r="'+r.r.toFixed(1)+'" class="ring"/><text x="'+(L.origin.x+3)+'" y="'+(L.origin.y-r.r+11).toFixed(1)+'" class="rl">'+r.km+' km</text>').join('')+
   '<circle cx="'+L.origin.x+'" cy="'+L.origin.y+'" r="5" class="home"/>'+
   L.points.map((q,i)=>'<a href="#cat-card-'+esc(q.id)+'" data-act="cat-open" data-val="'+esc(q.id)+'"><circle cx="'+q.x+'" cy="'+q.y+'" r="9" class="pt"/><text x="'+q.x+'" y="'+(q.y+3.5)+'" class="pn">'+(i+1)+'</text></a>').join('')+
   '</svg><figcaption class="small muted">Luftlinien-Kreise um euren Start (●). Nummer antippen öffnet das Ziel.'+(more?' Die Karte zeigt die ersten 20 Ziele der Liste.':'')+'</figcaption></figure>';
}
/* Zwölf Monate mit Text, nicht nur Farbe */
function catSeasonStrip(months,label){
  if(!months||!months.length)return '';
  const good=new Set(months.map(Number));
  return '<div class="season" aria-label="'+esc(label||'Gute Reisemonate')+': '+esc([...good].sort((a,b)=>a-b).map(m=>MONTHS[m-1]).join(', '))+'">'+MONTHS.map((m,i)=>'<span class="'+(good.has(i+1)?'on':'')+'" title="'+m+(good.has(i+1)?': gute Reisezeit':'')+'">'+m.slice(0,1)+(good.has(i+1)?'<i>✓</i>':'')+'</span>').join('')+'</div>';
}

/* Tagesideen: ein Highlight plus eine ruhige Ergänzung am selben Ziel (DESIGN_CATALOG.md, Vorschlag 3) */
/* Wann wohin? Jahresüberblick über die aktuellen Treffer: je Monat Anzahl guter Ziele und Beispiele (typische Reisezeiten, nicht geprüft) */
function catYear(res){
  const s=catState(),pl=res.places||[];if(!pl.length)return '';
  const rows=MONTHS.map((m,i)=>{const good=pl.filter(p=>p.months.includes(i+1));
    const top=good.slice().sort((a,b)=>(b.kinds.filter(k=>s.kinds.includes(k)).length-a.kinds.filter(k=>s.kinds.includes(k)).length)||a.airKm-b.airKm).slice(0,3);
    return {m:i+1,name:m,n:good.length,top}});
  const max=Math.max(1,...rows.map(r=>r.n));
  return '<details class="panel"><summary><b>Wann wohin? Jahresüberblick</b> <small class="muted">gute Reisemonate der '+pl.length+' Ziele im Bereich</small></summary><p class="small muted">Typische Reisezeiten aus dem Katalog, für eure Daten nicht geprüft. Monat antippen übernimmt ihn als Reisemonat.</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Monat</th><th class="r">passend</th><th>zum Beispiel</th></tr></thead><tbody>'+
   rows.map(r=>'<tr'+(String(r.m)===s.month?' class="total"':'')+'><td><button type="button" class="lnk" data-act="cat-month" data-val="'+r.m+'" aria-pressed="'+(String(r.m)===s.month)+'">'+r.name+'</button></td><td class="r num"><span class="yearbar" style="width:'+Math.round(r.n/max*48)+'px"></span> '+r.n+'</td><td class="small">'+r.top.map(p=>esc(p.name)).join(' · ')+'</td></tr>').join('')+'</tbody></table></div></details>';
}

/* Stopps und Ausflüge nachladen: zwei weitere Abfragen mit derselben Quelle */
async function catExtras(x){
  const s=catState(),p=x.place,id=p.id;
  catSimilar(p).catch(()=>{const el=$('#cat-similar');if(el)el.innerHTML=''});
  const [way,around]=await Promise.all([
    s.origin&&x.roadKm!=null?catalogQuery({lat:s.origin.lat,lon:s.origin.lon,maxKm:Math.min(CATX.MAX_KM,x.roadKm+40),minKm:0}).catch(()=>({places:[]})):Promise.resolve({places:[]}),
    catalogQuery({lat:p.lat,lon:p.lon,maxKm:80,minKm:0}).catch(()=>({places:[]}))]);
  if(s.openId!==id)return;
  const stops=s.origin?CATX.stopsAlong(way.places,s.origin,p):[],near=CATX.nearbyFrom(around.places,p,50).filter(n=>!stops.some(st=>st.spot.id===n.spot.id));
  stops.forEach(e=>{s.index[e.spot.id]={spot:e.spot,place:e.place,kind:'stop',detourKm:e.detourKm}});
  near.forEach(e=>{s.index[e.spot.id]={spot:e.spot,place:e.place,kind:'near',roadKm:e.roadKm}});
  const a=$('#cat-stops'),b=$('#cat-near');
  if(a)a.innerHTML=stops.length?'<p class="small muted">Liegen auf dem Weg, Umweg geschätzt. Werden am Anreisetag eingeplant.</p><div class="checks-list">'+stops.map(e=>catSpotRow(Object.assign({kind:'stop'},e),false)).join('')+'</div>':'<p class="small muted">'+(x.roadKm<80?'Für kurze Strecken keine Stopps.':'Keine Katalog-Idee nah genug an der Strecke.')+'</p>';
  if(b)b.innerHTML=near.length?'<div class="checks-list">'+near.map(e=>catSpotRow(Object.assign({kind:'near'},e),false)).join('')+'</div>':'<p class="small muted">Keine weiteren Katalog-Ideen im Umkreis von 50 km.</p>';
}
/* Ziel per ID öffnen (Direktsuche, Ähnliche, Link #ziel-<id>); mit Start wie ein Suchtreffer bewertet, sonst ohne Entfernung */
async function catOpenById(id){
  const s=catState();let x=catFind(id);
  if(!x){const data=await catLoadLocal(),raw=data.places.find(q=>q.id===id);if(!raw){alertMsg('Dieses Ziel gibt es im Katalog nicht (mehr).');return}
    if(s.origin){try{x=await catLoadPlace(id,raw.lat,raw.lon)}catch(e){x=null}}
    if(!x){const p=CATX.normPlace(raw);x={place:p,spots:p.spots.filter(sp=>CATX.spotSeason(sp,s.month)!==false),why:[],score:0,season:CATX.seasonFit(p,s.month),nightsFit:null,roadKm:null,minutes:null,closed:0,indoor:0,version:data.version,source:'lokal'};x.closed=p.spots.length-x.spots.length;s.extra[id]=x}}
  catOpen(id);
}

/* Auswahl als eigene Unternehmungen mit Tagesgerüst in eine Reise übernehmen (nur additive Felder). */
function catApply(t,picked,nights){
  const acts={},main=[],stops=[];
  picked.forEach(e=>{const a=CATX.toAct(e.spot,e.place,uid);if(e.kind==='stop'){a.km=e.detourKm;a.note+=' Zwischenstopp, Umweg ca. '+e.detourKm+' km (geschätzt).';stops.push(a)}else{if(e.kind==='near'){a.km=e.roadKm*2;a.note+=' Ausflug vom Ziel, hin und zurück ca. '+e.roadKm*2+' km (geschätzt).'}main.push(Object.assign({},e.spot,{id:a.id,slot:e.spot.slot}))}acts[a.id]=a});
  t.customActs=(t.customActs||[]).concat(Object.values(acts));
  const plan=CATX.dayPlan(main,nights).map(i=>({uid:uid('i'),act:i.spotId,day:i.day,slot:i.slot}));
  /* gewählte Kombi am selben Tag: Ergänzung in das andere Tagesfenster des Highlights legen, wenn dort frei */
  const cb=(catState().combo||[]).map(id=>Object.values(acts).find(a=>a.catalogSpot===id)).filter(Boolean);
  if(cb.length===2){const hi=plan.find(i=>i.act===cb[0].id),ca=plan.find(i=>i.act===cb[1].id);
    if(hi&&ca&&hi.day!==ca.day){const other=hi.slot==='morgen'?'nachm':'morgen';if(!plan.some(i=>i.day===hi.day&&i.slot===other)){ca.day=hi.day;ca.slot=other}}}
  const st=stops.map(a=>({uid:uid('i'),act:a.id,day:0,slot:'mittag'}));
  t.items=(t.items||[]).concat(st,plan);
  return {acts:Object.keys(acts).length,planned:plan.length+st.length};
}
function catTripType(p,nights,month){
  const m=+month||0;
  if(nights===0)return 'tag';
  if(p.kinds.includes('winter')&&[12,1,2,3].includes(m))return 'winter';
  if(p.kinds[0]==='stadt')return 'stadt';
  if(p.kinds.includes('wasser')&&[6,7,8].includes(m)&&nights>=4)return 'strand';
  return nights<=2?'wochenende':'rund';
}

  const s=catState(),x=catFind(s.openId);if(!x)return;

  const picked=catPicked();
  const t=newTrip({title:p.name,type:catTripType(p,nights,s.month),nights,persons,budget:0,origin:s.origin.label,originGeo:{lat:s.origin.lat,lon:s.origin.lon},dest:p.name+(p.region?', '+p.region:''),travel:'auto',km:x.roadKm,kmSrc:'schaetzung',
    destGeo:{lat:p.lat,lon:p.lon,place:p.id,v:x.version},
    notes:'Aus dem Umkreis-Katalog (Version '+x.version+', '+(x.source==='db'?'Datenbank':'Offline-Kopie')+'). '+p.summary+(p.angle?'\nIdee: '+p.angle:'')+'\nFahrstrecke '+x.roadKm+' km ist eine Schätzung; Preise und Öffnungszeiten vor Ort prüfen.'});
  if(s.month){t.dateMode='flex';t.month=catNextMonth(s.month)}

  t.id=uid('t');save(t,true);closeSheet();go('r-'+t.id+'-plan');
  alertMsg('Reise angelegt: '+r.acts+' Ideen übernommen, '+r.planned+' davon eingeplant. Preise sind noch offen.');
}
function catAdd(){
  const s=catState(),t=Store.get($('#cat-trip').value);if(!t)return;
  if(Store.isAccount()&&!Store.canEdit(t.id)){alertMsg('Nur Leserecht für diese Reise.');return}
  const picked=catPicked();if(!picked.length){alertMsg('Keine Idee ausgewählt.');return}
  const r=catApply(t,picked,nightsOf(t));save(t);closeSheet();go('r-'+t.id+'-plan');
  alertMsg(r.acts+' Ideen zur Reise „'+t.title+'“ hinzugefügt.');
}
/* Rundreise: Reihenfolge nach kürzestem Weg (Schätzung), Nächte je Etappe, eine Reise mit Etappen und Tagesgerüst */
function catTourPlan(){
  const s=catState(),r=CATX.roundTrip(s.origin,s.tour);
  const nights=s.tourNights&&s.tourNights.length===r.order.length&&s.tourOrder===r.order.map(p=>p.id).join(',')?s.tourNights:CATX.splitNights(r.order,r.order.reduce((n,p)=>n+Math.max(1,p.nights[0]),0));
  s.tourOrder=r.order.map(p=>p.id).join(',');s.tourNights=nights;return Object.assign(r,{nights});
}

function catTourCreate(){
  const s=catState(),r=catTourPlan(),P=Math.max(1,Math.min(20,Math.round(num(($('#cat-tp')||{}).value,2))));
  const nights=r.nights.reduce((a,b)=>a+b,0);
  const t=newTrip({title:'Rundreise: '+r.order.map(p=>p.name.split(/[ (&]/)[0]).join(' – ').slice(0,70),type:'rund',nights,persons:P,budget:0,origin:s.origin.label,dest:r.order.map(p=>p.name).join(' → ').slice(0,200),travel:'auto',
    km:Math.round(r.roadKm/2),kmSrc:'schaetzung',destGeo:{lat:r.order[0].lat,lon:r.order[0].lon,place:r.order[0].id,v:(catFind(r.order[0].id)||{}).version||0},
    originGeo:{lat:s.origin.lat,lon:s.origin.lon},
    legs:r.order.map((p,i)=>({place:p.id,name:p.name.slice(0,120),lat:p.lat,lon:p.lon,nights:r.nights[i],roadKm:r.legs[i].roadKm})),
    notes:'Rundreise aus dem Umkreis-Katalog. Gesamtstrecke ≈ '+r.roadKm+' km einschließlich Heimfahrt (Schätzung, Luftlinie × 1,3); im Feld „Entfernung“ steht die Hälfte, weil die App Hin- und Rückweg rechnet.\n'+r.legs.map((l,i)=>(i===0?s.origin.label:l.from.name)+' → '+(i===r.legs.length-1?s.origin.label:l.to.name)+': ≈ '+l.roadKm+' km').join('\n')});
  if(s.month){t.dateMode='flex';t.month=catNextMonth(s.month)}
  let start=0;const prefs=catPrefs();
  r.order.forEach((p,i)=>{
    const x=catFind(p.id)||catRank({version:0,places:[p]})[0];
    const to=i===r.order.length-1?nights:start+r.nights[i]-1;
    const occ=(t.items||[]).map(it=>it.day+'|'+it.slot);
    if(i>0){const mv={id:uid('c'),custom:true,t:'Weiterfahrt nach '+p.name,cat:'eigen',cost:0,per:'grp',dur:'ca. '+CATX.durText(r.legs[i].minutes),link:'',note:'Etappe ≈ '+r.legs[i].roadKm+' km (geschätzt). Die Kilometer sind schon in der Anreise der Reise enthalten.',slot:'morgen',map:p.name,ort:p.name,transit:true,hours:Math.round(r.legs[i].minutes/6)/10};
      t.customActs.push(mv);t.items.push({uid:uid('i'),act:mv.id,day:start,slot:'morgen'});occ.push(start+'|morgen')}
    const spots=x.spots.filter(sp=>!s.family||sp.family);
    const acts={};spots.forEach(sp=>{acts[sp.id]=CATX.toAct(sp,p,uid)});
    const plan=CATX.dayPlan(spots,nights,occ,{from:start,to});
    plan.forEach(it=>{const a=acts[it.spotId];t.customActs.push(a);t.items.push({uid:uid('i'),act:a.id,day:it.day,slot:it.slot})});
    start+=r.nights[i];
  });
  t.id=uid('t');save(t,true);closeSheet();s.tour=[];go('r-'+t.id+'-plan');
  alertMsg('Rundreise angelegt: '+r.order.length+' Etappen, '+t.items.length+' Punkte im Tagesplan. Preise und genaue Fahrzeiten sind noch offen.');
}
async function catSearch(surprise){
  const s=catState();if(!s.origin)return;
  s.busy=true;s.err='';render();
  try{
    const r=await catalogQuery({lat:s.origin.lat,lon:s.origin.lon,maxKm:s.maxKm,minKm:s.minKm,kinds:[]});
    r.ranked=catRank(r);s.extra={};
    s.res=r;
  }catch(e){s.err=e.message;s.res=null}
  s.busy=false;catSavePrefs();render();
  if(s.res&&surprise){const pick=CATX.surprise(s.res.ranked);if(pick)catOpen(pick.place.id);else alertMsg('Im gewählten Bereich gibt es keine Ziele. Kilometer vergrößern oder Themen abwählen.')}
  else if(s.res){const el=document.getElementById('cat-results');if(el&&el.scrollIntoView)try{el.scrollIntoView({block:'start'})}catch(e){}}
}
async function catGeoSearch(text){
  text=String(text||'').trim();const s=catState();if(text.length<2){alertMsg('Bitte einen Ort oder eine Postleitzahl eingeben.');return}
  const low=text.toLowerCase(),local=CATX.ORIGINS.filter(o=>o.label.toLowerCase().startsWith(low));
  s.geoBusy=true;render();
  try{
    const r=await catTimeout(fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=de&countrycodes=de,at,ch,fr,it,nl,be,lu,cz,pl,dk&q='+encodeURIComponent(text),{headers:{Accept:'application/json'}}),8000);
    if(!r.ok)throw new Error('Ortssuche: Fehler '+r.status);
    const j=await r.json();
    s.geoHits=local.concat((Array.isArray(j)?j:[]).map(h=>({label:String(h.display_name||'').split(',').slice(0,3).join(',').trim().slice(0,80),lat:Math.round(+h.lat*1000)/1000,lon:Math.round(+h.lon*1000)/1000})).filter(h=>h.label&&CATX.validPoint(h))).slice(0,6);
  }catch(e){s.geoHits=local;if(!local.length)alertMsg('Ortssuche nicht erreichbar ('+e.message+'). Bitte eine Stadt aus der Liste wählen.')}
  s.geoBusy=false;render();
}
function catSetOrigin(o){const s=catState();s.origin={label:String(o.label).slice(0,80),lat:+o.lat,lon:+o.lon};s.geoHits=null;s.res=null;catSavePrefs();render()}
/* In einer Reise: weitere Katalog-Ideen rund um das Ziel */
async function catTripIdeas(t){
  const g=t.destGeo;if(!g||!CATX||!CATX.validPoint(g))return;
  openSheet('<span class="eyebrow">Umkreis-Katalog</span><h2>Mehr Ideen rund um '+esc(t.dest||t.title)+'</h2><div id="cat-trip-ideas"><p role="status">Suche …</p></div>');
  try{
    const r=await catalogQuery({lat:g.lat,lon:g.lon,maxKm:80,minKm:0});
    const have=new Set((t.customActs||[]).map(a=>a.catalogSpot).filter(Boolean)),s=catState();s.index={};
    const list=[];r.places.forEach(p=>p.spots.forEach(sp=>{if(have.has(sp.id))return;const d=CATX.airKm(g,sp);if(d<=50)list.push({spot:sp,place:p,kind:p.id===g.place?'dest':'near',roadKm:CATX.roadKm(d),d})}));
    list.sort((a,b)=>a.d-b.d);list.forEach(e=>{s.index[e.spot.id]=e});
    const el=$('#cat-trip-ideas');if(!el)return;
    el.innerHTML=list.length?catSourceLine(r)+'<div class="checks-list">'+list.slice(0,15).map(e=>catSpotRow(e,false)).join('')+'</div><div class="row"><button type="button" class="btn" data-act="cat-trip-add">Ausgewählte hinzufügen</button></div>':'<p>Alle Katalog-Ideen in der Nähe sind schon in dieser Reise.</p>';
  }catch(e){const el=$('#cat-trip-ideas');if(el)el.innerHTML='<p>'+esc(e.message)+'</p>'}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act^="cat-"]');if(!b||!CATX)return;
  const act=b.getAttribute('data-act'),val=b.getAttribute('data-val'),s=catState();
  switch(act){
    case 'cat-geo':
      if(!navigator.geolocation){alertMsg('Standort wird von diesem Browser nicht unterstützt. Bitte Ort eingeben.');return}
      s.geoBusy=true;render();
      navigator.geolocation.getCurrentPosition(pos=>{s.geoBusy=false;catSetOrigin({label:'Mein Standort (gerundet)',lat:Math.round(pos.coords.latitude*100)/100,lon:Math.round(pos.coords.longitude*100)/100})},
        err=>{s.geoBusy=false;render();alertMsg('Standort nicht verfügbar'+(err&&err.code===1?' (keine Freigabe)':'')+'. Bitte Ort eingeben oder aus der Liste wählen.')},{timeout:10000,maximumAge:600000});return;
    case 'cat-geo-search':catGeoSearch(($('#cat-q')||{}).value);return;
    case 'cat-pick':{const h=s.geoHits&&s.geoHits[+val];if(h)catSetOrigin(h);return}
    case 'cat-origin-clear':s.origin=null;s.res=null;catSavePrefs();render();return;
    case 'cat-range':{const r=CATX.RANGES.find(x=>x.id===val);if(r){s.range=r.id;s.minKm=r.min;s.maxKm=r.max;s.res=null;catSavePrefs();render()}return}
    case 'cat-preset':catPreset(val);render();return;
    case 'cat-profile-clear':catProfileChange(CATX.checkProfile({}));s.deckIndex=0;render();return;
    case 'cat-mood-mode':s.deckMode=val==='deck';render();return;
    case 'cat-deck-back':s.deckIndex=Math.max(0,(s.deckIndex||0)-1);render();return;
    case 'cat-vote':{const [kind,level]=String(val||'').split('|');if(Object.keys(CAT_MOODS)[s.deckIndex||0]!==kind)return;catSetMood(kind,level);s.deckIndex=Math.min(Object.keys(CAT_MOODS).length,(s.deckIndex||0)+1);render();const next=$('[data-act="cat-vote"]')||$('[data-act="cat-deck-back"]');if(next&&next.focus)next.focus();return}
    case 'cat-search':catSearch(false);return;
    case 'cat-surprise':catSearch(true);return;
    case 'cat-open':e.preventDefault();catOpen(val);return;
    case 'cat-fav':{const x=catFind(val),f=catFavs().find(q=>q.id===val);const p=x?x.place:f;if(p){catFavToggle(p);render()}return}
    case 'cat-fav-open':{const f=catFavs().find(q=>q.id===val);if(!f||!s.origin)return;catLoadPlace(f.id,f.lat,f.lon).then(()=>catOpen(f.id)).catch(err=>alertMsg(err.message));return}
    case 'cat-tour':{const x=catFind(val);if(!x)return;if(s.tour.some(q=>q.id===val))s.tour=s.tour.filter(q=>q.id!==val);else if(s.tour.length>=6){alertMsg('Höchstens 6 Ziele pro Rundreise.');return}else s.tour=s.tour.concat([x.place]);render();return}
    case 'cat-tour-clear':s.tour=[];render();return;
    case 'cat-cmp':{if(s.cmp.includes(val))s.cmp=s.cmp.filter(id=>id!==val);else if(s.cmp.length>=3){alertMsg('Höchstens 3 Ziele im Vergleich.');return}else if(catFind(val))s.cmp=s.cmp.concat([val]);render();return}
    case 'cat-cmp-clear':s.cmp=[];render();return;
    case 'cat-cmp-open':catCompareSheet();return;
    case 'cat-tour-open':catTourSheet();return;

/* ================= Tagesplan: realistische Tage, Tausch, Lücken, Tagesroute (Issue #8) ================= */
const DRIVE_KMH=80, DAY_HOURS=10;
function actHours(a){if(!a)return null;const h=num(a.hours,0);if(h>0)return h;if(CATX)return CATX.parseHours(a.dur);const m=String(a.dur||'').replace(',','.').match(/(\d+(?:\.\d+)?)\s*std/i);return m?+m[1]:null}
/* Fahrminuten je Tag: Anreise, Etappen (Rundreise), Heimfahrt. Straßen-km aus der Reise, Ø 80 km/h, Schätzung. */
function driveByDay(t){
  const n=daysOf(t).length,out=new Array(n).fill(0);if(t.travel!=='auto')return out;
  const km=routeKm(t),min=k=>Math.round(k/DRIVE_KMH*60),routed=t.kmSrc==='route';
  if(Array.isArray(t.legs)&&t.legs.length){let d=0;const inc=t.legs.reduce((x,l)=>x+num(l.roadKm,0),0);
    t.legs.forEach((l,i)=>{if(d<n)out[d]+=num(l.routeMin,0)>0?num(l.routeMin,0):min(num(l.roadKm,0));d+=Math.max(1,Math.round(num(l.nights,1)))});
    out[n-1]+=routed&&num(t.routeHomeMin,0)>0?num(t.routeHomeMin,0):min(Math.max(0,km*2-inc));return out}
  const one=routed&&num(t.routeMin,0)>0?num(t.routeMin,0):min(km),back=routed&&num(t.routeHomeMin,0)>0?num(t.routeHomeMin,0):one;
  if(n===1){out[0]=one+back;return out}
  out[0]=one;out[n-1]+=back;return out;
}
function dayLoad(t){
  const days=daysOf(t),drive=driveByDay(t);
  return days.map(d=>{let planned=0,unknown=0;
    (t.items||[]).filter(it=>it.day===d.i).forEach(it=>{const a=actOf(t,it.act);if(!a||a.transit)return;const h=actHours(a);if(h==null)unknown++;else planned+=h});
    const cap=Math.max(0,DAY_HOURS-drive[d.i]/60);
    return {day:d.i,planned:Math.round(planned*10)/10,unknown,drive:drive[d.i],cap:Math.round(cap*10)/10,over:planned>cap+0.25};
  });
}
/* Kartenlink mit allen Stationen eines Tages (Reihenfolge wie im Plan), Start und Ziel = Unterkunft bzw. Reiseziel */
function dayRouteUrl(t,day){
  const st=stayOf(t),base=(st&&(st.ort||st.name))||t.dest||'';
  const stops=sortedItems(t).filter(it=>it.day===day).map(it=>actOf(t,it.act)).filter(a=>a&&!a.transit&&(a.map||a.ort)).map(a=>a.map||a.ort);
  const uniq=[...new Set(stops)].slice(0,9);
  if(!uniq.length||!base)return '';
  return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(base)+'&destination='+encodeURIComponent(base)+'&waypoints='+encodeURIComponent(uniq.join('|'))+'&travelmode=driving';
}

/* ================= Rundreise: Etappen umsortieren und Nächte ändern (Issue #8) ================= */
/* Tag, an dem Etappe i beginnt; die letzte Etappe reicht bis zum Abreisetag. */
function legStarts(legs){let d=0;return legs.map(l=>{const s=d;d+=Math.max(1,Math.round(num(l.nights,1)));return s})}
function legOfDay(starts,day){let k=0;starts.forEach((s,i)=>{if(day>=s)k=i});return k}
/* order: neue Reihenfolge als Indizes der alten Etappen; nights: Nächte in neuer Reihenfolge. Gibt eine geänderte Kopie zurück. */
function reorderLegs(t,order,nights){
  const legs=t.legs||[];
  if(!Array.isArray(order)||order.length!==legs.length||[...order].sort((a,b)=>a-b).some((v,i)=>v!==i))throw new Error('Ungültige Reihenfolge.');
  const nn=(nights||order.map(i=>legs[i].nights)).map(n=>Math.max(1,Math.min(21,Math.round(num(n,1)))));
  const oldTotal=legs.reduce((x,l)=>x+Math.max(1,Math.round(num(l.nights,1))),0),newTotal=nn.reduce((a,b)=>a+b,0);
  if(t.dateMode==='fix'&&newTotal!==oldTotal)throw new Error('Feste Reisedaten: Die Summe der Nächte muss gleich bleiben ('+oldTotal+'). Daten zuerst unter „Eckdaten“ ändern.');
  const c=clone(t),oldStarts=legStarts(legs);
  const newLegs=order.map((i,k)=>Object.assign({},legs[i],{nights:nn[k]})),newStarts=legStarts(newLegs),lastDay=newTotal;
  const transitIds=new Set((c.customActs||[]).filter(a=>a.transit).map(a=>a.id));
  c.items=(c.items||[]).filter(it=>!transitIds.has(it.act)).map(it=>{
    const k=legOfDay(oldStarts,it.day),pos=order.indexOf(k),off=it.day-oldStarts[k];
    const span=pos===newLegs.length-1?lastDay-newStarts[pos]:newLegs[pos].nights-1;
    return Object.assign({},it,{day:newStarts[pos]+Math.max(0,Math.min(off,span))});
  });
  c.customActs=(c.customActs||[]).filter(a=>!a.transit);
  /* Etappen-km neu schätzen; ohne Koordinaten des Starts bleiben Anfahrt und Heimfahrt unbekannt */
  const est=(a,b)=>CATX?CATX.roadKm(CATX.airKm(a,b)):null,og=t.originGeo&&CATX&&CATX.validPoint(t.originGeo)?t.originGeo:null;
  newLegs.forEach((l,k)=>{const from=k===0?og:newLegs[k-1];l.roadKm=from&&est(from,l)!=null?est(from,l):(k===0?num(l.roadKm,0):l.roadKm)});
  newLegs.forEach((l,k)=>{if(k===0)return;const min=Math.round(num(l.roadKm,0)/DRIVE_KMH*60);
    const mv={id:uid('c'),custom:true,t:'Weiterfahrt nach '+l.name,cat:'eigen',cost:0,per:'grp',dur:'ca. '+(CATX?CATX.durText(min):min+' Min.'),link:'',note:'Etappe ≈ '+num(l.roadKm,0)+' km (geschätzt). Die Kilometer sind schon in der Anreise der Reise enthalten.',slot:'morgen',map:l.name,ort:l.name,transit:true,hours:Math.round(min/6)/10};
    c.customActs.push(mv);c.items.push({uid:uid('i'),act:mv.id,day:newStarts[k],slot:'morgen'})});
  c.legs=newLegs;c.dest=newLegs.map(l=>l.name).join(' → ').slice(0,200);
  if(c.dateMode!=='fix')c.nights=newTotal;
  if(og&&c.kmSrc==='schaetzung'){const home=est(newLegs[newLegs.length-1],og);c.km=Math.round((newLegs.reduce((x,l)=>x+num(l.roadKm,0),0)+home)/2)}
  c.packageId='';
  return {trip:c,recalculated:!!og};
}

   (d?'<div class="note"><b>Neue Reihenfolge noch nicht übernommen</b><p>Die Programmpunkte wandern mit ihrer Etappe, Weiterfahrten und Kilometer werden neu geschätzt'+(t.originGeo?'':' (ohne Koordinaten des Abfahrtsorts bleiben Anfahrt und Heimfahrt unverändert)')+'. Gebuchte oder bezahlte Termine werden nicht verschoben.</p><div class="row"><button type="button" class="btn sm" data-act="leg-apply">Übernehmen</button><button type="button" class="btn ghost sm" data-act="leg-cancel">Verwerfen</button></div></div>':'')+'</section>';

<title>Reiseplaner</title>
<!-- Entwicklungsstand 1.4 · 13.10.2026
Grundlage: bereitgestellte Reiseplaner(1).html. Bestehender Speicherschlüssel rp-trips bleibt erhalten.
Neu: explizite Gästekartenbestätigung, gemeinsames Top-Leistungs-Tageslimit,
volle Reisedauer, datumsgebundenes Silvester, manuelle Strecke, offene Kosten,
Zurücksetzen unterkunftsgebundener Angaben, Speicherfehleranzeige, Eingabeprüfungen.
Manueller JSON-Export für einzelne/alle Reisen und Import mit Prüfung/Vorschau;
bei ID-Konflikt nur überspringen oder zusätzliche Kopie, nie überschreiben.
Logik- und Startansicht-Prüfungen in Node erfolgreich. Kein Browser-/iPhone-Test: Browserbinary nicht verfügbar.
Dateivorschau der ChatGPT-iPhone-App zeigt die Kopfzeile, führt die interaktive Oberfläche offenbar nicht zuverlässig aus.
Statische Lade-/Fehlermeldung hinzugefügt. Privates Hosting vorbereitet, Veröffentlichung wegen Netzwerkproxy-Fehler offen.
Keine Anbieterrecherche durchgeführt. Katalogangaben bleiben unbestätigt.
Offen: konkrete Angebote mit Gebühren/Preisbasen; Import bestehender Altdateien ohne Sicherungsformat;
Zahlungen und Kaution; genaue Termine und Reisezeiten; vollständige Quellennachweise;
Saisonprüfung der Vorlagen; Tarife bei >5 Verleihtagen; gemeinsame Nutzung mit Zugriffsschutz.
Lokaler Browser-Speicher ist keine Gerätesynchronisation. Bestehende Claude-DB-Anbindung unverändert.
v1.4: beschädigter lokaler Speicher wird nicht überschrieben; Rohdaten-Download und bewusstes Zurücksetzen.
v1.5: Unterwegs-Ansicht (heute/morgen), laufende Reise nicht mehr als „vorbei“, Reisemappe mit Druck/PDF,
Kalenderexport (.ics, grobe Zeitfenster, vorläufig) und Text zum Teilen. Kein neues Speicherfeld.
v1.6: Plan B bei schlechtem Wetter (Indoor-Ideen passend zu Datum/Katalogregeln), Offline-Start per Service Worker
(nur über http/https, Netz zuerst), App-Icon und Manifest für den Homescreen. Browser-Klicktest im Repo.
v1.7: Packliste aus dem Plan (Mitbringsel der geplanten Unternehmungen). Spartipps: keine Unterkunft ohne Sauna
empfehlen, wenn Sauna in der Unterkunft geplant ist; kein „frei mit PLUS“ ohne bestätigte Gästekarte.
Nächster Schritt: echter Browser-/iPhone-Klicktest, dann Angebots-/Kostenmodell und bezahlte/offene Beträge.
-->

/* ================= Reise-Logik ================= */
function nightsOf(t){if(t.dateMode==='fix'){const a=pd(t.start),b=pd(t.end);if(a&&b&&b>a)return Math.round((b-a)/864e5)}return Math.max(0,Math.round(num(t.nights,3)))}
function daysOf(t){
  const n=nightsOf(t)+1, out=[], a=pd(t.start);
  for(let i=0;i<n;i++){
    if(t.dateMode==='fix'&&a){const d=new Date(a.getTime()+i*864e5);out.push({i,date:d,label:fmtD(d),md:iso(d).slice(5)})}
    else out.push({i,date:null,label:'Tag '+(i+1),md:''});
  }
  return out;
}
function rangeText(t){
  if(t.dateMode==='fix'){const a=pd(t.start),b=pd(t.end);if(a&&b)return fmtLong(a)+' – '+fmtLong(b)+' · '+nightsOf(t)+' Nächte'}
  if(t.dateMode==='flex'){const m=t.month?MONTHS[+t.month.slice(5,7)-1]+' '+t.month.slice(0,4):'Zeitraum offen';return m+' · '+nightsOf(t)+' Nächte (flexibel)'}
  return 'Datum noch offen · '+nightsOf(t)+' Nächte geplant';
}
const placeOf=t=>t.catalog==='allgaeu'?PLACES[t.place]||null:null;
function stayOf(t){if(!t.stayId)return null;return STAYS.find(s=>s.id===t.stayId)||(t.customStays||[]).find(s=>s.id===t.stayId)||null}
function actOf(t,id){return ACTS[id]||(t.customActs||[]).find(a=>a.id===id)||null}
function actsFor(t){
  const out=[];
  if(t.catalog==='allgaeu'&&t.place) Object.values(ACTS).forEach(a=>{const ps=a.place.split('|');if(a.place==='*'||ps.includes(t.place))out.push(a)});
  (t.customActs||[]).forEach(a=>out.push(a));
  return out;
}
function sortedItems(t){const so={morgen:0,mittag:1,nachm:2,abend:3};return (t.items||[]).slice().sort((a,b)=>a.day-b.day||so[a.slot]-so[b.slot])}

function routeKm(t){const pl=placeOf(t);return t.routeKm!=null?Math.max(0,num(t.routeKm,0)):(pl&&t.origin==='73110 Hattenhofen'?pl.km:Math.max(0,num(t.km,0)))}
function resetStay(t){t.stayQuote=null;t.cardConfirmed=false;if(t.check)delete t.check.stay;}
function openCosts(t){const out=[];
 if(!stayOf(t))out.push('Unterkunft fehlt');
 else {if(!(num(t.stayQuote,0)>0))out.push('Konkretes Unterkunftsangebot fehlt');out.push('Endreinigung, Pflichtzuschläge und enthaltene Gebühren prüfen');}
 if(t.travel==='auto'&&!routeKm(t))out.push('Fahrstrecke fehlt');
 if(t.travel!=='auto'&&!num(t.ticket,0))out.push('Ticketpreis fehlt');
 if(t.travel==='auto')out.push('Parken und gegebenenfalls Maut prüfen');
 return out;
}
function costNotice(t){return '<div class="note"><b>Vorläufige Planung · kein bestätigter Gesamtpreis</b><p class="small">'+esc(openCosts(t).join(' · '))+'. Katalogpreise und Öffnungszeiten wurden für eure Reisedaten nicht neu geprüft. Ein Restbudget ist noch keine Zusage, dass die Reise im Budget liegt.</p></div>';}
/* Kosten */
function cost(t){
  const P=Math.max(1,Math.round(num(t.persons,2))), N=nightsOf(t), pl=placeOf(t), st=stayOf(t), lines=[];
  const add=(cat,label,sub,c,src)=>lines.push({cat,t:label,s:sub,c:+c||0,src:src||'est'});
  const days=daysOf(t), maxDay=days.length-1;
  const items=sortedItems(t).filter(it=>it.day<=maxDay&&actOf(t,it.act));
  /* Unterkunft */
  if(st){
    if(num(t.stayQuote,0)>0) add('unterkunft',st.name,'Euer Angebotspreis gesamt',num(t.stayQuote,0),'ok');
    else{const pn=num(st.plan!=null?st.plan:st.priceNight,0);add('unterkunft',st.name,(st.ab?st.ab+' · ':'')+'Planwert '+eur(pn)+' / Nacht × '+N+(st.custom?'':' (Silvester +15 %, geschätzt)'),pn*N,st.custom?'ok':'est')}
  }
  /* Anreise */
  if(t.travel==='auto'){
    let km=routeKm(t)*2+(pl?pl.local:0);
    items.forEach(it=>{const a=actOf(t,it.act);km+=(a.kmBy&&pl&&a.kmBy[t.place]!=null)?a.kmBy[t.place]:(a.km||0)});
    const l=km*num(t.verb,7.5)/100;
    add('anreise','Sprit · ≈ '+Math.round(km)+' km',dec(l,1)+' l × '+dec(num(t.preis,2.15),2)+' € · inkl. Fahrten vor Ort',l*num(t.preis,2.15));
  } else if(num(t.ticket,0)>0) add('anreise',t.travel==='bahn'?'Bahn-Tickets':'Flug / Ticket','eure Eingabe',num(t.ticket,0),'ok');
  if(pl) add('gebuehren','Kurbeitrag','≈ '+dec(pl.taxe,2)+' € p. P. / Nacht',pl.taxe*P*N);
  /* Schneesport */
  const kursIt=items.filter(it=>actOf(t,it.act).kurs), kursDays=[...new Set(kursIt.map(i=>i.day))];
  const passDays=new Set(); kursDays.slice(1).forEach(d=>passDays.add(d));
  items.forEach(it=>{if(actOf(t,it.act).pass)passDays.add(it.day)});
  const card=!!(st&&t.cardConfirmed===true);
  const topUsed=new Set(passDays);
  if(pl&&kursDays.length){const k=kursDays.length, price=k<=3?pl.kurs[k]:pl.kurs[3]+35*(k-3);add('schnee','Gruppenkurs · '+k+(k>1?' Tage':' Tag'),pl.school+' · '+price+' € p. P.',price*P,pl.kursSrc)}
  const gearDays=new Set(items.filter(it=>actOf(t,it.act).gear).map(i=>i.day)).size;
  if(gearDays){const g=Math.min(5,gearDays);let r=(RENT_SET[g]+RENT_HELM[g])*P;const on=pl&&pl.onlineRent&&t.online!==false;if(on)r*=0.9;add('schnee','Verleih Set + Helm · '+gearDays+(gearDays>1?' Tage':' Tag'),(RENT_SET[g]+RENT_HELM[g])+' € p. P.'+(on?' · −10 % online':'')+(pl&&pl.onlineRent?'':' · Preise wie Iseler angenommen'),r,pl&&pl.onlineRent?'ok':'est')}
  let saved=0;
  if(pl&&passDays.size){const n=passDays.size;
    if(pl.cardPass&&card){saved=pl.passDay*P*n;add('schnee','Skipass · '+n+(n>1?' Tage':' Tag'),'in '+pl.card+' enthalten'+(st.card==='?'?' (beim Gastgeber bestätigen!)':''),0,'plus')}
    else if(pl.cardPass){add('schnee','Skipass · '+n+(n>1?' Tage':' Tag'),'Unterkunft ohne Gästekarte: '+dec(pl.passDay,2)+' € p. P. / Tag',pl.passDay*P*n,'est')}
    else{const tb=pl.passTable,pp=n<=3?tb[n]:tb[3]/3*n;add('schnee','Skipass · '+n+(n>1?' Tage':' Tag'),dec(pp,2)+' € p. P. ('+pl.passSrc+')',pp*P,'ok')}
  }
  /* Unternehmungen */
  items.forEach(it=>{const a=actOf(t,it.act);if(a.kurs)return;
    let c;
    if(a.custom){c=a.per==='pp'?num(a.cost,0)*P:num(a.cost,0)}
    else{let pp=a.pp||0;if(a.cardPp!=null&&card){pp=a.cardPp;if(a.top){if(topUsed.has(it.day))pp=a.pp;else topUsed.add(it.day)}}if(a.ppKurs!=null&&kursDays.length)pp=a.ppKurs;c=pp*P+(a.grp||0)}
    const d=days[it.day];
    if(c>0||a.custom) add(a.custom?(a.cat||'eigen'):a.cat,a.t,(d?d.label+' · '+SLOTNAME[it.slot]:''),c,a.custom?'ok':a.src);
  });
  /* Essen */
  const f=FOOD[t.food]||FOOD.selbst;let fpp=f[1]*(N+1);if(st&&st.breakfast)fpp-=7*N;
  add('essen','Essen & Trinken · '+f[0],f[2]+' · ≈ '+f[1]+' € p. P. / Tag'+(st&&st.breakfast?' · Frühstück inklusive':''),Math.max(0,fpp)*P);
  (t.extraCosts||[]).forEach(e=>add('eigen',e.t||'Eigener Posten',e.note||'',num(e.c,0),'ok'));
  const sub=lines.reduce((s,l)=>s+l.c,0);

/* Plan-Check */
function checks(t){

  if(st&&st.card&&!t.cardConfirmed)out.push(['warn','Gästekarte für diesen Aufenthalt unbestätigt: keine Rabatte eingerechnet','unterkunft']);
  out.push(['info','Zeitfenster sind grob: Fahrtzeiten, Check-in und genaue Termine noch prüfen','plan']);
  const items=sortedItems(t);
  items.forEach(it=>{const a=actOf(t,it.act), d=days[it.day];if(!a)return;
    if(!d){out.push(['warn',a.t+' liegt nach dem letzten Reisetag','plan']);return}
    if(a.onlyDate&&d.md&&d.md!==a.onlyDate) out.push(['warn',a.t+' ist für Silvester gedacht, steht aber am '+d.label,'plan']);
    if(a.dow&&d.date&&!a.dow.includes(d.date.getUTCDay())) out.push(['warn',a.t+' gibt es nur '+a.dow.map(x=>({0:'sonntags',1:'montags',2:'dienstags',3:'mittwochs',4:'donnerstags',5:'freitags',6:'samstags'})[x]).join('/')+', nicht am '+d.label,'plan']);
    (a.rules||[]).forEach(r=>{if(d.md===r.date&&r.bad.includes(it.slot))out.push(['warn',a.t+' am '+d.label+': '+r.msg,'plan'])});
    if(a.kitchen&&st&&!st.kitchen) out.push(['warn',a.t+' braucht eine Küche, '+st.name+' hat keine','plan']);
    if(a.needSauna&&st&&!st.sauna) out.push(['warn','Sauna in der Unterkunft eingeplant, '+st.name+' hat laut Inserat keine','plan']);
    if(a.warn) out.push(['warn',a.t+': '+a.warn,'plan']);
  });
  const kd=c.kursDays; for(let i=1;i<kd.length;i++) if(kd[i]-kd[i-1]>1){out.push(['info','Kurstage nicht am Stück: bei der Skischule nachfragen, ob das geht','plan']);break}
  const ue=items.filter(it=>actOf(t,it.act)&&actOf(t,it.act).pass);
  if(ue.length&&kd.length&&ue[0].day<kd[0]) out.push(['info','Übungstag liegt vor dem ersten Kurstag','plan']);
  const occ={};items.forEach(it=>{const k=it.day+it.slot;occ[k]=(occ[k]||0)+1});

  if(num(t.budget,0)>0&&c.total>num(t.budget,0)) out.push(['warn',eur(c.total-num(t.budget,0))+' über eurem Budget, siehe Spartipps','kosten']);
  if(!out.length) out.push(['info','Keine erkennbaren Konflikte in den groben Zeitfenstern','plan']);
  return out;
}

function savingTips(t){
  const base=cost(t).total, out=[], st=stayOf(t), pl=placeOf(t);
  const tryT=(label,fn)=>{const c=clone(t);if(fn(c)===false)return;const s=base-cost(c).total;if(s>=5)out.push({t:label,save:s,fn})};
  const needs=k=>(t.items||[]).some(i=>actOf(t,i.act)&&actOf(t,i.act)[k]);
  if(pl){const cheapest=STAYS.filter(s=>s.place===t.place&&(s.kitchen||!needs('kitchen'))&&(s.sauna||!needs('needSauna'))).sort((a,b)=>a.plan-b.plan)[0];
    if(cheapest&&st&&cheapest.id!==st.id&&!num(t.stayQuote,0)) tryT('Günstigste passende Unterkunft: '+cheapest.name,c=>{resetStay(c);c.stayId=cheapest.id})}
  const kurs=sortedItems(t).filter(i=>actOf(t,i.act)&&actOf(t,i.act).kurs);
  if(kurs.length>=2) tryT('Nur 1 Kurstag statt '+kurs.length+' (Rest als Übungstag)',c=>{const last=kurs[kurs.length-1];c.items=c.items.filter(i=>i.uid!==last.uid);const ue=Object.values(ACTS).find(a=>a.pass&&a.place===t.place);if(ue&&!c.items.some(i=>i.act===ue.id))c.items.push({uid:uid('i'),act:ue.id,day:last.day,slot:'morgen'})});
  const swap=(from,to,label)=>{if((t.items||[]).some(i=>i.act===from)&&ACTS[to])tryT(label,c=>{c.items.forEach(i=>{if(i.act===from)i.act=to})})};
  swap('oj-kristall','oj-wsauna','Wonnemar-Sauna statt Kristall-Therme');
  swap('oj-wsauna','oj-wbad','Wonnemar-Bad'+(st&&t.cardConfirmed===true?' (mit bestätigter Gästekarte frei)':'')+' statt Saunawelt');
  if(!st||st.kitchen){swap('silv-menu','silv-raclette','Raclette in der Wohnung statt Silvestermenü');swap('silv-huette','silv-raclette','Raclette in der Wohnung statt Hütten-Silvester')}
  if(t.food!=='selbst'&&(!st||st.kitchen)) tryT('Mehr selbst kochen statt auswärts essen',c=>{c.food='selbst'});
  if(pl&&pl.onlineRent&&t.online===false) tryT('Verleih online buchen (−10 %)',c=>{c.online=true});

  return out.sort((a,b)=>b.save-a.save);
}

function setField(obj,f,v){
  if(['persons','nights','budget','km','routeKm','ticket','verb','preis','stayQuote'].includes(f)&&num(v,0)<0){alertMsg('Negative Werte sind nicht erlaubt.');return;}
  if(['persons','nights'].includes(f)){obj[f]=Math.max(f==='persons'?1:0,Math.round(num(v,0)));return;}
  if(['persons','nights','budget','km','routeKm','ticket'].includes(f)) obj[f]=Math.max(0,num(v,0));
  else if(['verb','preis'].includes(f)) obj[f]=num(v,f==='verb'?7.5:2.15);

  else obj[f]=v;
}

    if(file.size>5*1024*1024){alertMsg('Sicherung ist zu groß (maximal 5 MB).');return}
    file.text().then(txt=>{UI.importDraft=validateBackup(JSON.parse(txt));sheetImport()}).catch(err=>{UI.importDraft=null;alertMsg('Import nicht möglich: '+err.message)});return;
  }
  if(el.matches('[data-act="check"]')&&t){t.check=t.check||{};if(el.checked)t.check[el.getAttribute('data-val')]=true;else delete t.check[el.getAttribute('data-val')];save(t);render();return}
  if(el.matches('[data-act="card-confirm"]')&&t){t.cardConfirmed=el.checked;save(t);render();return}
  if(el.matches('[data-act="mappe-notes"]')){UI.mappeNotes=el.checked;render();return}
  if(el.matches('[data-act="online"]')&&t){t.online=el.checked;save(t);render();return}
  const f=el.getAttribute('data-f'); if(!f) return;
  if(el.closest('#draft')){setField(UI.draft,f,el.value);if(['start','end','nights'].includes(f))render();return}
  if(el.closest('#editform')){setField(UI.edit,f,el.value);return}
  if(t){setField(t,f,el.value);save(t);if(f!=='notes')render()}
});
document.addEventListener('input',e=>{
  if(Store.corruptRaw!==null)return;
  const el=e.target, f=el.getAttribute('data-f'), t=cur(); if(!f) return;
  if(el.closest('#draft')){setField(UI.draft,f,el.value);return}
  if(el.closest('#editform')){setField(UI.edit,f,el.value);return}
  if(!t) return;
  setField(t,f,el.value);save(t);
  if(['verb','preis','ticket','stayQuote','budget'].includes(f)){renderDock();const box=document.querySelector('.tbl-wrap');if(box&&UI.tab==='kosten'){clearTimeout(window.__rt);window.__rt=setTimeout(()=>{const a=document.activeElement,id=a&&a.getAttribute('data-f'),pos=a&&a.selectionStart;render();if(id){const n=document.querySelector('[data-f="'+id+'"]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(err){}}}},500)}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
window.addEventListener('hashchange',()=>go(location.hash,true));
function alertMsg(m){let n=$('#msg');if(!n){n=document.createElement('div');n.id='msg';n.setAttribute('role','alert');n.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:90vw';document.body.appendChild(n)}n.textContent=m;n.hidden=false;clearTimeout(n._t);n._t=setTimeout(()=>{n.hidden=true},2600)}
function toast(b,m){alertMsg(m)}

})();
